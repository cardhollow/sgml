		function renderEmbeddedSGML(source,{allowInfo=true,allowRoot=true,allowLine=true}={}){
			let text=maskLiteralStrings(normalizeComponentSource(source));
			const extracted=extractCustomComponents(text);
			let rebuilt='';
			let cursor=0;
			const blockSlots=[];
			const inlineSlots=[];

			const allowedComponents=extracted.components.filter(component=>{
				if(component.type==='info')return allowInfo;
				if(component.type==='root')return allowRoot;
				if(component.type==='line')return allowLine;
				if(component.type==='spoiler')return true;
				return false;
			});

			allowedComponents.forEach(component=>{
				rebuilt+=text.slice(cursor,component.index);

				if(component.type==='info'||component.type==='spoiler'){
					const id=inlineSlots.length;
					inlineSlots.push(component);
					rebuilt+=`\uE210SGMLINLINE${id}\uE211`;
				}else{
					const id=blockSlots.length;
					blockSlots.push(component);
					rebuilt+=`\n\n<div data-sgml-block-slot="${id}"></div>\n\n`;
				}
				cursor=component.end;
			});

			if(!allowedComponents.length)rebuilt=text;
			else rebuilt+=text.slice(cursor);

			const qResult=parseQuestionBlocks(rebuilt);
			let result=renderMarkdown(qResult.processedText);

			qResult.questions.forEach(q=>{
				result=result.replace(`%%QBLOCKTOKEN${q.id}%%`,buildQuestionUI(q));
			});

			inlineSlots.forEach((component,index)=>{
				let html='';
				if(component.type==='info')html=buildInfoHTML(component,false);
				else if(component.type==='spoiler')html=buildSpoilerHTML(component);
				result=result.replace(`\uE210SGMLINLINE${index}\uE211`,html);
			});

			blockSlots.forEach((component,index)=>{
				let html='';
				if(component.type==='root')html=buildTreeHTML({content:component.content});
				else if(component.type==='line')html=buildLineHTML({content:component.content});
				result=result.replace(`<div data-sgml-block-slot="${index}"></div>`,html);
			});

			return result;
		}

		function stripUnsafeSGML(str){
			if(!str)return'';

			return String(str)
				.replace(/<(iframe|object|embed|portal|frame|frameset|applet)\b[^>]*>[\s\S]*?<\/\1\s*>/gi,'')
				.replace(/<(iframe|object|embed|portal|frame|frameset|applet)\b[^>]*\/?>/gi,'')
				.replace(/<\/(iframe|object|embed|portal|frame|frameset|applet)\s*>/gi,'');
		}

		function parseTreeNodeContent(content){
			const extracted=extractChildren(content,'bh',true);
			const ownContent=removeSpans(
				content,
				extracted.spans
			);

			return{
				content:renderEmbeddedSGML(ownContent),
				children:extracted.children.map(branch=>
					parseTreeNodeContent(branch.content)
				)
			};
		}

		function renderTreeComponent(content){
			return parseTreeNodeContent(content);

		function createTreeNode(nodeData){
			const node=document.createElement('div');
			node.className='sgml-tree-node';

			const card=document.createElement('div');
			card.className='sgml-tree-card';

			const cardContent=document.createElement('div');
			cardContent.className='sgml-tree-card-content';
			cardContent.innerHTML=nodeData.content||'<p>Empty node.</p>';

			card.appendChild(cardContent);
			node.appendChild(card);

			const childData=nodeData.children||[];

			if(childData.length){
				card.classList.add('has-children');

				const children=document.createElement('div');
				children.className='sgml-tree-children';

				childData.forEach(data=>{
					const child=document.createElement('div');
					child.className='sgml-tree-child';
					child.appendChild(createTreeNode(data));
					children.appendChild(child);
				});

				node.appendChild(children);

			}

			return node;
		}

		function resizeTreeToContent(tree){
			if(!tree)return;

			const layer=tree.querySelector('.sgml-tree-nodes');
			if(!layer)return;

			tree.style.width='max-content';
			tree.style.height='auto';

			const layerRect=layer.getBoundingClientRect();
			const treeRect=tree.getBoundingClientRect();
			const width=Math.max(680,Math.ceil(layerRect.width+60));
			const height=Math.max(190,Math.ceil(layerRect.height+60));

			tree.style.width=`${width}px`;
			tree.style.height=`${height}px`;
		}

		function updateTreeConnections(tree){
			if(!tree)return;

			const svg=tree.querySelector('.sgml-tree-svg');
			if(!svg)return;

			resizeTreeToContent(tree);
	
			const treeRect=tree.getBoundingClientRect();
			const width=Math.max(680,tree.clientWidth);
			const height=Math.max(190,tree.clientHeight);

			svg.setAttribute('width',width);
			svg.setAttribute('height',height);
			svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
			svg.innerHTML='';

			const makePath=d=>{
				const path=document.createElementNS(
					'http://www.w3.org/2000/svg',
					'path'
				);
				path.classList.add('sgml-tree-path');
				path.setAttribute('d',d);
				svg.appendChild(path);
			};

			tree.querySelectorAll('.sgml-tree-node.expanded').forEach(parent=>{
				const parentCard=parent.querySelector(':scope > .sgml-tree-card');
				const childrenWrap=parent.querySelector(':scope > .sgml-tree-children');

				if(!parentCard||!childrenWrap)return;

				const childNodes=[...childrenWrap.querySelectorAll(':scope > .sgml-tree-child > .sgml-tree-node')];
				if(!childNodes.length)return;

				const parentRect=parentCard.getBoundingClientRect();
				const parentX=parentRect.left+parentRect.width/2-treeRect.left;
				const parentY=parentRect.bottom-treeRect.top;

				const childPoints=childNodes.map(child=>{
					const card=child.querySelector(':scope > .sgml-tree-card');
					const rect=card.getBoundingClientRect();
					return{
						x:rect.left+rect.width/2-treeRect.left,
						y:rect.top-treeRect.top
					};
				});

				const childY=Math.min(...childPoints.map(point=>point.y));
				const minX=Math.min(...childPoints.map(point=>point.x));
				const maxX=Math.max(...childPoints.map(point=>point.x));
				const busY=parentY+Math.max(24,(childY-parentY)*0.42);

				makePath(`M ${parentX} ${parentY} C ${parentX} ${parentY+12}, ${parentX} ${busY-12}, ${parentX} ${busY}`);
				makePath(`M ${minX} ${busY} L ${maxX} ${busY}`);

				childPoints.forEach(point=>{
					makePath(`M ${point.x} ${busY} C ${point.x} ${busY+12}, ${point.x} ${point.y-12}, ${point.x} ${point.y}`);
				});
			});
		}

		function buildTreeHTML(block){
			const treeData=renderTreeComponent(block.content);

		function setupVisualResize(container,footer){
			if(!container||!footer||footer.dataset.bound==='true')return;
			footer.dataset.bound='true';

			let dragging=false;
			let startY=0;
			let startHeight=320;
			let pointerId=null;

			const onMove=event=>{
				if(!dragging)return;
				if(pointerId!==null&&event.pointerId!==pointerId)return;

				const delta=event.clientY-startY;
				const maxHeight=Math.max(180,window.innerHeight-32);
				const height=Math.max(180,Math.min(maxHeight,startHeight+delta));

				container.style.height=`${height}px`;
			};

			const end=event=>{
				if(pointerId!==null&&event.pointerId!==pointerId)return;

				dragging=false;
				footer.classList.remove('dragging');

				if(footer.releasePointerCapture&&pointerId!==null){
					try{
						if(footer.hasPointerCapture(pointerId)){
							footer.releasePointerCapture(pointerId);
						}
					}catch(_){}
				}

				pointerId=null;
				window.removeEventListener('pointermove',onMove);
				window.removeEventListener('pointerup',end);
				window.removeEventListener('pointercancel',end);

				document.querySelectorAll('.sgml-tree').forEach(updateTreeConnections);
			};

			footer.addEventListener('pointerdown',event=>{
				event.preventDefault();

				dragging=true;
				startY=event.clientY;
				startHeight=container.getBoundingClientRect().height;
				pointerId=event.pointerId;
				footer.classList.add('dragging');

				if(footer.setPointerCapture){
					try{footer.setPointerCapture(pointerId)}catch(_){}
				}

				window.addEventListener('pointermove',onMove);
				window.addEventListener('pointerup',end);
				window.addEventListener('pointercancel',end);
			});
		}

		function setupLineComponent(container){
			if(!container||container.dataset.lineBound==='true')return;
			container.dataset.lineBound='true';

			const nodes=[...container.querySelectorAll('.sgml-line-node')];
			const rail=container.querySelector('.sgml-line-rail');
			const line=container.querySelector('.sgml-line');
			const end=container.querySelector('.sgml-line-end');

			if(!nodes.length||!rail||!line)return;

			let visible=1;

			function refresh(){
				nodes.forEach((node,index)=>{
					const shown=index<visible;
					const current=shown&&index===visible-1&&index<nodes.length-1;

					node.classList.toggle('visible',shown);
					node.classList.toggle('current',current);
				});

				if(end){
					end.classList.toggle('visible',visible===nodes.length);
				}

				requestAnimationFrame(()=>{
					const last=nodes[visible-1];

					if(last){
						rail.style.bottom=`${Math.max(
							0,
							line.scrollHeight-last.offsetTop-last.offsetHeight+8
						)}px`;
					}
				});
			}

			nodes.forEach((node,index)=>{
				const title=node.querySelector('.sgml-line-title');
				if(!title)return;

				title.addEventListener('click',()=>{
					if(index>=visible)return;

					if(index===visible-1){
						if(visible<nodes.length)visible++;
					}else{
						visible=index+1;
					}

					refresh();
				});
			});

			refresh();
		}

		function setupTreeComponent(container){
			if(!container)return;

			const tree=container.querySelector('.sgml-tree');
			if(!tree)return;

			tree.querySelectorAll('.sgml-tree-node').forEach(node=>{
				const card=node.querySelector(':scope > .sgml-tree-card');
				const children=node.querySelector(':scope > .sgml-tree-children');

				if(!card||!children||card.dataset.bound==='true')return;

				card.dataset.bound='true';

				card.addEventListener('click',event=>{
					if(event.target.closest('button,a,input,textarea,select'))return;

					const expanding=!node.classList.contains('expanded');

					if(!expanding){
						children.querySelectorAll('.sgml-tree-node.expanded').forEach(descendant=>{
							descendant.classList.remove('expanded');
							const descendantCard=descendant.querySelector(':scope > .sgml-tree-card');
							if(descendantCard)descendantCard.classList.remove('expanded');
						});
					}

					node.classList.toggle('expanded',expanding);
					card.classList.toggle('expanded',expanding);

					requestAnimationFrame(()=>{
						resizeTreeToContent(tree);
						updateTreeConnections(tree);
					});
				});
			});

			requestAnimationFrame(()=>{
				resizeTreeToContent(tree);
				updateTreeConnections(tree);
			});
		}

		function setupVisualComponents(){
			document.querySelectorAll('.sgml-tree-visual,.sgml-line-visual').forEach(container=>{
				const footer=container.querySelector('.sgml-visual-footer');
				if(footer)setupVisualResize(container,footer);
			});

			document.querySelectorAll('.sgml-tree-visual').forEach(setupTreeComponent);
			document.querySelectorAll('.sgml-line-visual').forEach(setupLineComponent);

		function parseLineNodes(content){
			const extracted=extractChildren(content,'node',false);

			return extracted.children.map(node=>{
				return{
					title:getAttributeFromTag(node.open,'title')||'Node',
					content:node.content
				};
			});

		function getAttributeFromTag(tag,name){
			const double=tag.match(
				new RegExp(`${name}\\s*:\\s*"([^"]*)"`,`i`)
			);

			if(double)return double[1];

			const single=tag.match(
				new RegExp(`${name}\\s*:\\s*'([^']*)'`,`i`)
			);

			if(single)return single[1];

			const plain=tag.match(
				new RegExp(`${name}\\s*:\\s*([^\\s>]*)`,`i`)
			);

			return plain?plain[1]:'';
		}

		function buildLineHTML(block){

			const visualContent=document.createElement('div');

			const line=document.createElement('div');
			line.className='sgml-line';

			const rail=document.createElement('div');

			items.forEach((item,index)=>{

				const title=document.createElement('button');

				title.className='sgml-line-title';
				title.textContent=item.title||`Node ${index+1}`;

				const content=document.createElement('div');
				content.className='sgml-line-content';
				content.innerHTML=renderEmbeddedSGML(item.content);

				node.appendChild(title);
				node.appendChild(content);
				line.appendChild(node);
			});

			const end=document.createElement('div');
			end.className='sgml-line-end';
			end.textContent='End';
			line.appendChild(end);

			visualContent.appendChild(line);

			const footer=document.createElement('div');
			footer.className='sgml-visual-footer';
			footer.title='Drag to resize';
			footer.setAttribute('aria-label','Resize line node');

			container.appendChild(header);
			container.appendChild(visualContent);
			container.appendChild(footer);

			return container.outerHTML;
		}


		function extractCustomComponents(text){
			const components=[];
			const spans=[];
			let cursor=0;

			while(cursor<text.length){
				const candidates=[];

				['info','root','line','spoiler'].forEach(tag=>{
					const found=findTagStart(text,tag,cursor);
					if(found)candidates.push({...found,tag});
				});

				if(!candidates.length)break;
				candidates.sort((a,b)=>a.index-b.index);
				const found=candidates[0];

				const matched=findMatchingTag(text,found.tag,found.end,false);
				if(!matched){
					cursor=found.end;
					continue;
				}

				components.push({
					type:found.tag,
					open:found.open,
					content:matched.content,
					index:found.index,
					end:matched.end
				});

				spans.push({start:found.index,end:matched.end});
				cursor=matched.end;
			}

			return{components,spans};
		}

		function renderTopLevelWithComponents(text){
			text=maskLiteralStrings(text);
			const extracted=extractCustomComponents(text);
			let rebuilt='';
			let cursor=0;
			const blocks=[];
			const inline=[];

			extracted.components.forEach(component=>{
				rebuilt+=text.slice(cursor,component.index);

				if(component.type==='info'||component.type==='spoiler'){
					const index=inline.length;
					inline.push(component);
					rebuilt+=`\uE210SGMLINLINE${index}\uE211`;
				}else{
					const index=blocks.length;
					blocks.push(component);
					rebuilt+=`\n\n<div data-sgml-block-slot="${index}"></div>\n\n`;
				}
				cursor=component.end;
			});

			rebuilt+=text.slice(cursor);

			const qResult=parseQuestionBlocks(rebuilt);
			let result=renderMarkdown(qResult.processedText);

			qResult.questions.forEach(q=>{
				result=result.replace(`%%QBLOCKTOKEN${q.id}%%`,buildQuestionUI(q));
			});

			inline.forEach((component,index)=>{
				let html='';
				if(component.type==='info')html=buildInfoHTML(component,false);
				else if(component.type==='spoiler')html=buildSpoilerHTML(component);
				result=result.replace(`\uE210SGMLINLINE${index}\uE211`,html);
			});

			blocks.forEach((component,index)=>{
				let html='';
				if(component.type==='root')html=buildTreeHTML({content:component.content});
				else if(component.type==='line')html=buildLineHTML({content:component.content});
				result=result.replace(`<div data-sgml-block-slot="${index}"></div>`,html);
			});

			return result;
		}

		function renderICBPlaceholders(str,blocks){
			if(!str||!blocks||!blocks.length)return str;

			return str.replace(
				/\uE100SGMLICB(\d+)\uE101/g,
				(_,index)=>{
					const i=Number(index);

					if(!blocks[i])return'';

					return`<div class="sgml-icb-slot" data-icb-index="${i}"></div>`;
				}
			);
		}

		function renderSGML(sgmlContent){
			parsedQuestions={};
			sgmlLiteralStore=[];
			sgmlEscapedStore=[];
			sgmlLiteralCounter=0;
			questionCounter=0;
			sgmlSpoilerIdCounter=0;
			infoCounter=0;
			sgmlInfoIdCounter=0;
			openInfoWrap=null;
			window.__sgmlInfoStore={};
			window.__sgmlICBBlocks=[];

			const icbResult=extractICBBlocks(sgmlContent);
			window.__sgmlICBBlocks=icbResult.blocks;

			const safeSGML=stripUnsafeSGML(icbResult.processedText);
			let renderedDoc=renderTopLevelWithComponents(safeSGML);

			renderedDoc=renderICBPlaceholders(
				renderedDoc,
				icbResult.blocks
			);

			const output=document.getElementById('sgml-output');
			output.innerHTML=renderedDoc;

			setupICB();
			setupVisualComponents();
			setupInfoPanels();
			setupConnectComponents();

			if(window.MathJax&&window.MathJax.typesetPromise){
				window.MathJax.typesetClear&&window.MathJax.typesetClear([output]);
				window.MathJax.typesetPromise([output]).catch(error=>{
					console.error('LaTeX rendering failed:',error);
				});
			}
		}

		function checkChoicesAnswer(qId){
			const q=parsedQuestions[qId];
			const selected=document.querySelector(
				`input[name="radio_${qId}"]:checked`
			);
			const fb=document.getElementById(`fb_${qId}`);

			if(!selected){
				fb.className='sgml-feedback incorrect';
				fb.textContent='Select an option.';
				return;
			}

			const selectedIdx=parseInt(selected.value,10);
			const userSelectedRaw=q.options[selectedIdx];
			const userTrueText=extractTrueText(userSelectedRaw);

			const isCorrect=q.correctAnswers.some(cRaw=>{
				const cTrueText=extractTrueText(cRaw);

				return q.props.case
					?userTrueText===cTrueText
					:userTrueText.toLowerCase()===cTrueText.toLowerCase();
			});

			setFeedback(fb,isCorrect);
		}

		function checkFillinAnswer(qId){
			const q=parsedQuestions[qId];
			const input=document.getElementById(`input_${qId}`);
			const fb=document.getElementById(`fb_${qId}`);
			const userTrueText=extractTrueText(input.value,{stripMarkup:false});

			const isCorrect=q.correctAnswers.some(cRaw=>{
				const cTrueText=extractTrueText(cRaw);

				return q.props.case
					?userTrueText===cTrueText
					:userTrueText.toLowerCase()===cTrueText.toLowerCase();
			});

			setFeedback(fb,isCorrect);
		}

		function checkEnumOrderAnswer(qId){
			const q=parsedQuestions[qId];
			const list=document.getElementById(`order_list_${qId}`);
			const fb=document.getElementById(`fb_${qId}`);
			const currentItems=[
				...list.querySelectorAll('.sgml-order-item')
			];

			const userTrueList=currentItems.map(
				li=>extractTrueText(
					decodeURIComponent(li.dataset.raw)
				)
			);

			const correctTrueList=q.correctAnswers.map(
				cRaw=>extractTrueText(cRaw)
			);

			let isCorrect=userTrueList.length===correctTrueList.length;

			if(isCorrect){
				for(let i=0;i<userTrueList.length;i++){
					const u=userTrueList[i];
					const c=correctTrueList[i];

					const match=q.props.case
						?u===c
						:u.toLowerCase()===c.toLowerCase();

					if(!match){
						isCorrect=false;
						break;
					}
				}
			}

			setFeedback(fb,isCorrect);
		}

		function checkEnumWrittenAnswer(qId){
			const q=parsedQuestions[qId];
			const inputs=[
				...document.querySelectorAll(`.input_${qId}`)
			];
			const fb=document.getElementById(`fb_${qId}`);

			const userTrueTexts=inputs
				.map(inp=>extractTrueText(inp.value,{stripMarkup:false}))
				.filter(t=>t.length>0);

			const correctTrueTexts=q.correctAnswers.map(
				cRaw=>extractTrueText(cRaw)
			);

			let isCorrect=true;

			if(userTrueTexts.length<q.count){
				isCorrect=false;
			}else if(q.props.inorder){
				for(let i=0;i<q.count;i++){
					const u=userTrueTexts[i]||'';
					const c=correctTrueTexts[i]||'';

					const match=q.props.case
						?u===c
						:u.toLowerCase()===c.toLowerCase();

					if(!match){
						isCorrect=false;
						break;
					}
				}
			}else{
				const availableCorrect=[...correctTrueTexts];

				for(const u of userTrueTexts){
					const matchIdx=availableCorrect.findIndex(
						c=>q.props.case
							?u===c
							:u.toLowerCase()===c.toLowerCase()
					);

					if(matchIdx!==-1)availableCorrect.splice(matchIdx,1);
					else{
						isCorrect=false;
						break;
					}
				}
			}

			setFeedback(fb,isCorrect);
		}

		function setFeedback(element,isCorrect){
			if(isCorrect){
				element.className='sgml-feedback correct';
				element.textContent='Correct!';
			}else{
				element.className='sgml-feedback incorrect';
				element.textContent='Incorrect!';
			}
		}

		function checkAllQuestions(){
			Object.keys(parsedQuestions).forEach(qId=>{
				const q=parsedQuestions[qId];

				if(q.type==='choices')checkChoicesAnswer(qId);
				else if(q.type==='fillin')checkFillinAnswer(qId);
				else if(q.type==='enum_order')checkEnumOrderAnswer(qId);
				else if(q.type==='enum_written')checkEnumWrittenAnswer(qId);
				else if(q.type==='connect')checkConnectAnswer(qId);
			});
		}

		function moveOrderItem(qId,btn,direction){
			const li=btn.closest('.sgml-order-item');
			const list=document.getElementById(`order_list_${qId}`);

			if(direction===-1&&li.previousElementSibling){
				list.insertBefore(li,li.previousElementSibling);

			}

		function setupDragAndDrop(){
			document.querySelectorAll('.sgml-order-list').forEach(list=>{
				let draggedItem=null;

				list.addEventListener('dragstart',e=>{
					draggedItem=e.target.closest('.sgml-order-item');
					if(draggedItem)draggedItem.classList.add('dragging');
				});

				list.addEventListener('dragend',()=>{
					if(draggedItem)draggedItem.classList.remove('dragging');
					draggedItem=null;
				});

				list.addEventListener('dragover',e=>{
					e.preventDefault();

					const draggableElements=[
						...list.querySelectorAll('.sgml-order-item:not(.dragging)')
					];

					const afterElement=draggableElements.reduce(
						(closest,child)=>{
							const box=child.getBoundingClientRect();
							const offset=e.clientY-box.top-box.height/2;

							if(offset<0&&offset>closest.offset){
								return{offset,element:child};
							}

							return closest;
						},
						{offset:Number.NEGATIVE_INFINITY}
					).element;

					if(draggedItem){
						if(afterElement==null)list.appendChild(draggedItem);
						else list.insertBefore(draggedItem,afterElement);
					}
				});
			});
		}

		function importFileContent(content,fileName='Upload'){
			const text=String(content||'');
			const title=getUploadTitle(fileName);
			const current=getCurrentDocument();

			if(!current||!(current.content||'').trim()){
				if(!current){
					const docs=loadDocuments();

					current.content=text;
					current.updatedAt=Date.now();

					const docs=loadDocuments().map(

					);

		function handleFileUpload(event){
			const file=event.target.files[0];
			event.target.value='';

			if(!file)return;

			const reader=new FileReader();

			reader.onload=function(e){
				importFileContent(
					String(e.target.result||''),
					file.name||'Upload'

				confirmDialog(

					'File import failed',
					'OK'
				);
			};

			reader.readAsText(file);
		}

		async function processSharedFile(){
			const url=new URL(location.href);
			const token=url.searchParams.get('__sgml_shared');

			if(!token)return;

			const dataURL=new URL(
				'./__sgml_shared_file?token='+encodeURIComponent(token),
				location.href
			);

			try{
				const response=await fetch(
					dataURL.href,
					{cache:'no-store'}
				);

				if(!response.ok){
					throw new Error(
						'Shared file could not be retrieved.'
					);
				}

				const data=await response.json();

				if(!data||typeof data.content!=='string'){
					throw new Error(
						'Shared file data was invalid.'
					);
				}

				importFileContent(
					data.content,
					data.name||'Shared File'
				);

				const worker=
					navigator.serviceWorker&&
					navigator.serviceWorker.controller;

				if(worker){
					worker.postMessage({
						type:'DELETE_SHARED_FILE',
						url:dataURL.href
					});
				}

				url.searchParams.delete('__sgml_shared');
				history.replaceState(
					null,
					'',
					url.href
				);
			}catch(error){
				console.error(
					'Could not import shared file:',
					error
				);

				await confirmDialog(
					'The shared file could not be imported. Try sharing the file again.',
					'File import failed',
					'OK'
				);

				url.searchParams.delete('__sgml_shared');
				history.replaceState(
					null,
					'',
					url.href
				);
			}
		}

		function downloadSGML(){
			const doc=getCurrentDocument();
			const content=String(
				document.getElementById('sgml-input').value||''
			);

			const base=String(
				doc&&doc.title||'Untitled SGML'
			)
				.replace(/\.[^.]+$/,'')
				.replace(/[\\/:*?"<>|]+/g,'_')
				.trim()||'Untitled SGML';

			const blob=new Blob([content],{
				type:'text/plain;charset=utf-8'
			});

			const url=URL.createObjectURL(blob);
			const a=document.createElement('a');

			a.href=url;
			a.download=base+'.sgml';
			a.setAttribute('download',base+'.sgml');

			document.body.appendChild(a);
			a.click();
			a.remove();

			setTimeout(
				()=>URL.revokeObjectURL(url),
				1000
			);
		}

		function renderLibraryList(){
			const list=document.getElementById('library-list');

			const docs=loadDocuments().sort(
				(a,b)=>(b.updatedAt||0)-(a.updatedAt||0)
			);

			list.innerHTML='';

			if(!docs.length){
				list.innerHTML=

				const loadButton=document.createElement('button');
				loadButton.className='sgml-library-load';
				loadButton.type='button';

				title.className='sgml-library-item-title';
				title.textContent=doc.title||'Untitled SGML';

				const preview=document.createElement('div');

				preview.textContent=firstLine;
				preview.title=firstLine;

				loadButton.appendChild(title);
				loadButton.appendChild(preview);

				loadButton.addEventListener(
					'click',
					async()=>{
						const current=getCurrentDocument();
						const currentIsSame=
							current&&current.id===doc.id;

						if(!currentIsSame){
							const ok=await confirmDialog(
								`Load "${doc.title||'Untitled SGML'}"?\n\nThis will replace the SGML currently open in the editor.`,
								'Load SGML',
								'Load'
							);

							if(!ok)return;
						}

						closeLibrary();
						loadDocumentIntoEditor(doc);
					}
				);

				const deleteButton=document.createElement('button');
				deleteButton.className='sgml-library-delete';
				deleteButton.type='button';
				deleteButton.textContent='X';
				deleteButton.setAttribute(
					'aria-label',
					`Delete ${doc.title||'Untitled SGML'}`
				);

				deleteButton.addEventListener(
					'click',
					async event=>{
						event.stopPropagation();

						const ok=await confirmDialog(
							`Delete "${doc.title||'Untitled SGML'}"?\n\nThis saved SGML will be permanently removed from local storage.`,
							'Delete SGML',
							'Delete'
						);

						if(!ok)return;

						const docsNow=loadDocuments();
						const remaining=docsNow.filter(
							item=>item.id!==doc.id
						);

						saveDocuments(remaining);

						if(currentDocumentId===doc.id){
							if(remaining.length){
								const next=remaining.slice().sort(
									(a,b)=>(b.updatedAt||0)-(a.updatedAt||0)
								)[0];

								loadDocumentIntoEditor(next);
							}else{
								const next={
									id:makeId(),
									title:'Untitled SGML',
									content:'',
									createdAt:Date.now(),
									updatedAt:Date.now()
								};

								saveDocuments([next]);
								loadDocumentIntoEditor(next);
							}
						}

						renderLibraryList();
					}
				);

				row.appendChild(loadButton);
				row.appendChild(deleteButton);
				list.appendChild(row);
			});
		}

# Study Guide: SGML — Study Guide Markup Language

SGML is a Markdown-based markup language designed for study guides, formatted notes, and interactive quizzes.

---

## Getting Started

### Enable Offline Mode

Enable Offline mode to allow the SGML viewer to work without an internet connection.

When Offline mode is enabled:

- Previously available SGML resources can be used offline.
- The study guide can continue working without a network connection.
- Cached resources may remain available after leaving the page.

<st col:#00aa00>Tip:</st> Enable Offline mode before disconnecting from the internet so the required resources can be cached.

---

### Load an SGML File

To start studying:

1. Open the SGML viewer.
2. Choose an \`.sgml\` file.
3. Load the file.
4. The SGML content is parsed and displayed as a study guide.
5. Interactive questions can then be answered directly.

<st col:#0066ff>my_study_guide.sgml</st>

## More Interactive Elements

### Connect

Match items from the first column with their partners in the second column.

<connect:(Match each element with its symbol)[[Hydrogen,Oxygen,Carbon][H,O,C]]{answers:[[idx:0][idx:0]],[[idx:1][idx:1]],[[idx:2][idx:2]]|shuffle:true}>

### Flashcards

Flashcards have no correct-answer validation. Reveal each card, study the answer, then mark yourself Correct, Wrong, or Skip.

<flashcard(Science Review)[[What is H2O?][What gas do plants use in photosynthesis?][What is the center of an atom called?]]{answers:[Water,Carbon dioxide,Nucleus]|shuffle:true}>

### Spoiler

The \`<spoiler>...</spoiler>\` element places a plain overlay directly over its rendered content. It behaves as an inline element like \`<st>\` or ordinary text, so it does not insert paragraph breaks or generated newlines around the content. The overlay automatically follows the rendered width and height of the content. Clicking the overlay reveals the content.

Inline example: This sentence contains <spoiler>hidden text</spoiler> and continues normally after it.

Formatted example: <spoiler><st col:#ff0000>Hidden red text</st></spoiler> stays in the same text flow.

The spoiler itself does not contain visible "Tap to reveal" text; the dark overlay is the only cover.

SGML is text-based, so the study guide can be edited directly.

<st col:#12ABEF bg:#f0f8ff>Blue Text with Background</st>

### Nested Formatting

Formatting can be placed inside other formatting elements.

<st col:#ff0000>
Red outer
<st col:#00aa00>Green inner</st>
Back to red.
</st>

---

## Interactive Questions

### Multiple Choice

Use \`<Choices:...>\` to create a multiple-choice question.

<Choices:(What is <st col:#ff0000>2 + 2</st>?)[<st bg:#e0f2fe>4</st>, 3, 5, 6]{[idx:0]}>

The first part is the question.

The square brackets contain the available choices.

The final section contains the answer.

In this example:

<st col:#00aa00>[idx:0]</st>

means that the first choice is correct.

Another example:

<Choices:(Which city is the capital of France?)[Berlin, Madrid, Paris, Rome]{Paris}>

---

### Commas Inside Choices

A comma normally separates choices.

When a choice contains a comma, wrap that entire value in backticks.

Example:

<Choices:(Which city contains a comma in its name?)[Manila, \`Washington, D.C.\`, Cebu]{[idx:1]}>

The backticks tell the parser that the comma inside the wrapped value is part of the text and is not a choice separator.

This works for answers as well:

<Fillin:(Enter the full city name)[]{\`Washington, D.C.\`}>

The rendered answer is:

<st col:#0066ff>Washington, D.C.</st>

---

### Escaping

SGML supports backslash escaping for structural characters.

<st col:#0066ff>&#92;,</st>

means a literal comma.

<st col:#0066ff>&#92;|</st>

means a literal pipe.

<st col:#0066ff>&#92;&#96;</st>

means a literal backtick.

<st col:#0066ff>&#92;&#92;</st>

means a literal backslash.

Other structural characters can also be escaped when necessary.

Backslash escaping is processed before separators and backtick wrapping.

---

### Fill-in-the-Blank

Use \`<Fillin:...>\` when the learner must enter an answer.

<Fillin:(What is the capital of France?)[]{Paris}>

Multiple accepted answers can be separated by commas.

<Fillin:(What is 2 + 2?)[]{4,Four}>

Both \`4\` and \`Four\` are accepted.

A value containing a comma can be wrapped:

<Fillin:(What exact phrase is shown?)[]{\`Hello, world\`}>

Only one answer is defined here because the comma is inside the backtick-wrapped value.

---

### Enumeration

Use \`<Enumeration:...>\` for questions involving a collection of answers.

<Enumeration:(Name 3 Primary Colors)[]{Red,Green,Blue|count:3|case:false|inorder:false}>

The options after the answer separator can define additional rules.

\`count:3\`

Requires three answers.

\`case:false\`

Makes the answer comparison case-insensitive.

\`inorder:false\`

Does not require the answers to be entered in a particular order.

---

### Ordered Enumeration

Enumeration can also require a specific order.

<Enumeration:(Arrange these numbers in ascending order)[3, 1, 4, 2]{1,2,3,4|type:order}>

Here:

\`type:order\`

means that the sequence must be entered in the specified order.

---

# Information Panels

The \`<info>\` element creates a small underlined and gray ⓘ indicator.

Clicking the indicator opens a contextual information panel.

### Basic Information

<info>
	<p>This is additional information hidden behind the ⓘ indicator.</p>
</info>

### Information With Title

<info title:"Photosynthesis">
	<h3>Photosynthesis</h3>
	<p>Photosynthesis is the process plants use to convert light energy into chemical energy.</p>
</info>

### Colored Information Panel

<info title:"Important Note" bg:#fff3cd col:#7a5b00>
	<h3>Important</h3>
	<p>The background and text colors of the information panel can be customized.</p>
	<st col:#b45309>This is SGML formatted text inside the panel.</st>
</info>

### Information Can Contain SGML

<info title:"Interactive Information" bg:#eef6ff col:#174a73>
	<h3>Extra Information</h3>
	<p>Information panels can contain normal HTML and SGML rendering.</p>

	<st col:#2563eb>Blue formatted text.</st>

	<Choices:(Which element creates this information panel?)[\`<info>\`, \`<line>\`, \`<root>\`, \`<bh>\`]{[idx:0]}>
</info>

# Tree Graph

The \`<root>\` and \`<bh>\` elements are used to create expandable tree structures.

The root contains the main concept.

Each \`<bh>\` creates a separate branch.

### Example Tree

<root>
	<h3>Photosynthesis</h3>
	<p>The process plants use to convert light energy into chemical energy.</p>

	<info title:"Photosynthesis Definition" bg:#eef6ff col:#174a73>
		<p>Photosynthesis transforms light energy into chemical energy stored in organic molecules.</p>
	</info>

	<bh>
		<h3>Light-dependent Reactions</h3>
		<p>These reactions use sunlight to produce ATP and NADPH.</p>

		<bh>
			<h3>Chlorophyll</h3>
			<p>A green pigment that absorbs light energy for photosynthesis.</p>

			<info>
				<p>Chlorophyll is especially important because it absorbs light used during photosynthesis.</p>
			</info>
		</bh>

		<bh>
			<h3>ATP Production</h3>
			<p>Light energy contributes to the production of ATP.</p>
		</bh>
	</bh>

	<bh>
		<h3>Calvin Cycle</h3>
		<p>A series of reactions that uses ATP and NADPH to produce sugars.</p>

		<bh>
			<h3>Carbon Fixation</h3>
			<p>Carbon dioxide is incorporated into an organic molecule.</p>
		</bh>

		<bh>
			<h3>Sugar Production</h3>
			<p>The cycle contributes to the production of glucose and other sugars.</p>
		</bh>
	</bh>
</root>

The tree starts with the root visible.

Click the root to reveal its branches.

Click a branch to reveal its own children.

Branches can contain HTML, Markdown-rendered content, \`<st>\`, \`<info>\`, and other supported SGML content.

# Line Node

The \`<line>\` element creates an expandable vertical sequence.

Each \`<node>\` has a \`title:\` that becomes the visible node.

### Example Line

<line>
	<node title:"Origin">
		<h3>The Beginning</h3>
		<p>The concept was first introduced as an early idea.</p>

		<info title:"Origin Details">
			<p>Additional information about the beginning of the process is shown here.</p>
		</info>
	</node>

	<node title:"Development">
		<h3>Development</h3>
		<p>During development, new techniques and ideas were introduced.</p>

		<ul>
			<li>New methods were introduced.</li>
			<li>Existing systems were improved.</li>
		</ul>

		<st col:#2563eb>Development expanded the original concept.</st>
	</node>

	<node title:"Expansion">
		<h3>Expansion</h3>
		<p>The system became more widely used and additional features were created.</p>

		<info title:"Expansion Information" bg:#f0fdf4 col:#166534>
			<p>The expansion stage introduced additional capabilities.</p>
		</info>
	</node>

	<node title:"Modern Era">
		<h3>Modern Era</h3>
		<p>The modern version contains the concepts and technologies developed throughout the timeline.</p>
	</node>
</line>

The first node is displayed initially.

Click the current node to reveal the next node.

Click an earlier visible node to collapse everything after that node.

## 1. SGML Source

The original document is text.

Example:

<Choices:(What is 2 + 2?)[4,3,5,6]{[idx:0]}>

---

## 2. Parser

The SGML parser searches the document for recognized structures.

For example:

\`<st ...>\`

is recognized as a formatting element.

\`<Choices:...>\`

is recognized as a multiple-choice question.

\`<Fillin:...>\`

is recognized as a fill-in-the-blank question.

\`<Enumeration:...>\`

is recognized as an enumeration question.

\`<info>\`

is recognized as an information panel.

\`<root>\`

is recognized as a tree root.

\`<bh>\`

is recognized as a tree branch.

\`<line>\`

is recognized as a line-node container.

\`<node>\`

is recognized as an individual line node.

When parsing a choice list:

- commas outside backticks separate values
- commas inside backticks are literal
- escaped separators are literal
- escaped backticks do not start or end a wrapped value

---

## 3. Formatting

When the parser encounters formatting attributes such as:

<st col:#ff0000>Red</st>

it interprets:

\`col:#ff0000\`

as the text color.

For example:

<st col:#ff0000>Red</st>

renders as red text.

A background can also be supplied:

<st col:#12ABEF bg:#f0f8ff>Blue Text with Background</st>

---

## 4. Information Panels

The \`<info>\` element is rendered as a small ⓘ indicator.

The information is hidden until the indicator is clicked.

An information panel can have optional attributes:

\`title:\`

controls the panel header.

\`bg:\`

controls the background theme.

\`col:\`

controls the text color.

Example:

<info title:"Example" bg:#eef6ff col:#174a73>
	<p>This is an information panel.</p>
</info>

The contents can still contain HTML and SGML formatting.

---

## 5. Tree Parsing

A tree begins with:

\`<root>\`

Branches are created with:

\`<bh>\`

A branch can contain additional nested \`<bh>\` elements.

Example:

<root>
	<h3>Root</h3>

	<bh>
		<h3>Branch A</h3>

		<bh>
			<h3>Branch A1</h3>
		</bh>
	</bh>

	<bh>
		<h3>Branch B</h3>
	</bh>
</root>

The viewer renders the hierarchy graphically and connects each branch to its parent.

---

## 6. Line Node Parsing

A line begins with:

\`<line>\`

Each node is created with:

\`<node title:"...">\`

Example:

<line>
	<node title:"First">
		<p>The first stage.</p>
	</node>

	<node title:"Second">
		<p>The second stage.</p>
	</node>

	<node title:"Third">
		<p>The third stage.</p>
	</node>
</line>

The nodes are displayed progressively and can be expanded or collapsed.

---

## 7. Question Parsing

An interactive question contains different parts.

Example:

<Choices:(What is 2 + 2?)[4,3,5,6]{[idx:0]}>

The parser can interpret it as:

Question:

\`What is 2 + 2?\`

Choices:

\`4, 3, 5, 6\`

Correct answer:

\`[idx:0]\`

Therefore the viewer knows which answer should be accepted.

A wrapped choice is parsed as one value:

<Choices:(Example)[Apple, \`Washington, D.C.\`, Banana]{[idx:1]}>

The comma inside \`Washington, D.C.\` does not create another choice.

Literal backtick values can also contain SGML-looking text:

<Choices:(Which custom element displays an information indicator?)[\`<info>\`,\`<line>\`,\`<root>\`,\`<bh>\`]{[idx:0]}>

These values are treated as plaintext.

---

## 8. Validation

After the learner submits an answer, the viewer compares it with the answer stored in the SGML.

For example:

<Fillin:(What is 2 + 2?)[]{4,Four, \`<four>\`}>

The viewer can accept:

\`4\`

or:

\`Four\`

depending on the answer rules implemented by the viewer.

---

## 9. Markdown Structure

SGML also uses Markdown-style structure.

A heading such as:

## Formatting

creates a section.

A larger heading such as:

# Study Guide: SGML

creates the main title.

This makes SGML easy to write and edit as ordinary text.

---

## 10. Offline Mode

Offline Mode separates the study guide's content from its network dependency.

The SGML document itself is still ordinary text, while the viewer can use cached resources and local browser storage to continue working offline.

This means the general workflow can be:

<st col:#00aa00>Load → Cache → Disconnect → Study Offline</st>

---

## SGML Structure Summary

An SGML study guide can therefore contain:

<st col:#0066ff>Markdown</st>
for document structure.

<st col:#0066ff>&lt;st&gt;</st>
for formatting.

<st col:#0066ff>&lt;Choices&gt;</st>
for multiple-choice questions.

<st col:#0066ff>&lt;Fillin&gt;</st>
for text answers.

<st col:#0066ff>&lt;Enumeration&gt;</st>
for lists and ordered answers.

<st col:#0066ff>&lt;info&gt;</st>
for contextual information.

<st col:#0066ff>&lt;root&gt; + &lt;bh&gt;</st>
for expandable tree structures.

<st col:#0066ff>&lt;line&gt; + &lt;node&gt;</st>
for expandable line-node sequences.

Together, these components allow one \`.sgml\` file to contain both the learning material and the interactive quiz logic.

# Remember

<st col:#ff0000>SGML is text.</st>

<st col:#00aa00>Markdown provides the document structure.</st>

<st col:#0066ff>SGML tags add formatting and interactive behavior.</st>

<st col:#aa00aa>The viewer parses the source and turns it into an interactive study guide.</st>

<st col:#0066ff>Use backticks to wrap a value containing a separator such as a comma.</st>

<st col:#0066ff>Use literal backticks when SGML-looking text should remain plaintext.</st>

<st bg:#e0f2fe>Escaped characters are treated as literal characters instead of structural syntax.</st>

<st bg:#e0f2fe>Offline Mode allows the viewer to continue working from cached/local resources when no internet connection is available.</st>

			let docs=loadDocuments();
			const savedId=localStorage.getItem(
				STORAGE_CURRENT_ID
			);
			const savedContent=localStorage.getItem(
				STORAGE_CURRENT_CONTENT
			);

			let current=docs.find(
				doc=>doc.id===savedId
			);

			if(!current&&docs.length){
				current=docs.slice().sort(
					(a,b)=>(b.updatedAt||0)-(a.updatedAt||0)

			}

					content:

					createdAt:Date.now(),
					updatedAt:Date.now()
				};

				docs.push(current);
				saveDocuments(docs);
			}else if(
				savedContent!==null&&
				current.id===savedId
			){
