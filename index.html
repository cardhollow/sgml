<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
	<title>SGML Viewer</title>
	<link rel="manifest" href="./manifest.json"/>
	<meta name="theme-color" content="#ffffff"/>
	<style>
		:root{
			--bg-color:#ffffff;
			--text-color:#111111;
			--border-color:#cccccc;
			--correct-color:#15803d;
			--incorrect-color:#b91c1c;
			--modal-overlay:rgba(0,0,0,.48);
			--component-bg:#fff;
			--component-header:#f8f8f8;
			--component-border:#cfcfcf;
			--component-line:#9ca3af;
			--component-active:#2563eb;
		}
		*{box-sizing:border-box;margin:0;padding:0}
		::selection{background:#fff176;color:#000}
		html,body{min-height:100%}
		body{
			font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
			color:var(--text-color);
			background:var(--bg-color);
			line-height:1.6;
			padding:16px;
			max-width:760px;
			margin:0 auto;
		}
		.sgml-toolbar{
			border-bottom:1px solid var(--border-color);
			padding-bottom:10px;
			margin-bottom:20px;
			display:flex;
			gap:8px;
			flex-wrap:nowrap;
			align-items:center;
			overflow-x:auto;
			overflow-y:hidden;
			white-space:nowrap;
			-webkit-overflow-scrolling:touch;
			scrollbar-width:thin;
		}
		.sgml-toolbar::-webkit-scrollbar{height:5px}
		.sgml-toolbar>*{flex:0 0 auto}
		button,.btn{
			font-family:inherit;
			font-size:14px;
			padding:6px 12px;
			background:#fff;
			border:1px solid #777;
			border-radius:3px;
			cursor:pointer;
			touch-action:manipulation;
		}
		button:active{background:#eee}
		.btn-submit{font-weight:bold;background:#f0f0f0}
		#editor-drawer{display:none;width:100%;margin-top:10px;white-space:normal}
		#editor-drawer.open{display:block}
		textarea#sgml-input{
			width:100%;
			height:220px;
			font-family:monospace;
			font-size:13px;
			padding:8px;
			border:1px solid var(--border-color);
			border-radius:3px;
			resize:vertical;
			white-space:pre;
			display:block;
		}
		#sgml-output{width:100%;word-wrap:break-word}
		#sgml-output h1,#sgml-output h2,#sgml-output h3,#sgml-output h4,#sgml-output h5,#sgml-output h6{
			margin-top:1.2em;
			margin-bottom:.4em;
			font-weight:600;
		}
		#sgml-output h1{font-size:1.75em;border-bottom:1px solid #eee;padding-bottom:.2em}
		#sgml-output h2{font-size:1.35em;border-bottom:1px solid #eee;padding-bottom:.2em}
		#sgml-output h3{font-size:1.15em}
		#sgml-output p{margin-bottom:1em}
		#sgml-output ul,#sgml-output ol{margin-bottom:1em;padding-left:1.5em}
		#sgml-output hr{border:0;border-top:1px solid var(--border-color);margin:1.2em 0}
		#sgml-output blockquote{border-left:3px solid #ccc;padding-left:.8em;color:#555;margin-bottom:1em}
		#sgml-output code{font-family:monospace;background:#f4f4f4;padding:2px 4px;border-radius:3px}
		#sgml-output pre{
			display:block;width:100%;max-width:100%;margin:1em 0;padding:10px 12px;
			overflow-x:auto;overflow-y:hidden;background:#f4f4f4;border:1px solid #ddd;
			border-radius:3px;font-family:monospace;font-size:13px;line-height:1.5;white-space:pre;
			-webkit-overflow-scrolling:touch;scrollbar-width:thin;
		}
		#sgml-output pre::-webkit-scrollbar{height:6px}
		#sgml-output pre code{display:block;padding:0;margin:0;background:transparent;border:0;border-radius:0;font:inherit;white-space:pre}
		#sgml-output :not(pre)>code{font-family:monospace;background:#f4f4f4;padding:2px 4px;border-radius:3px;white-space:break-spaces}
		#sgml-output table{
			width:100%;max-width:100%;margin:1em 0;border-collapse:collapse;border-spacing:0;
			display:block;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
			scrollbar-width:thin;font-size:14px;
		}
		#sgml-output table::-webkit-scrollbar{height:6px}
		#sgml-output th,#sgml-output td{padding:7px 10px;border:1px solid var(--border-color);text-align:left;vertical-align:top;white-space:nowrap}
		#sgml-output th{font-weight:600;background:#f4f4f4}
		#sgml-output tr:nth-child(even) td{background:#fafafa}
		.MathJax,.MathJax_Display{max-width:100%;overflow-x:auto;overflow-y:hidden}
		.sgml-ref{color:inherit;text-decoration:underline;cursor:pointer}
		.sgml-ref:visited,.sgml-ref:hover,.sgml-ref:active{color:inherit}
		.sgml-qblock{border:1px solid var(--border-color);padding:12px;margin:16px 0;border-radius:3px}
		.sgml-qtitle{font-weight:600;margin-bottom:10px}
		.sgml-options,.sgml-inputs{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
		.sgml-option{display:flex;align-items:center;gap:8px;cursor:pointer}
		.sgml-option input[type=radio]{width:16px;height:16px}
		input[type=text].sgml-text-input{
			width:100%;max-width:380px;padding:5px 8px;font-size:14px;
			border:1px solid var(--border-color);border-radius:3px;font-family:inherit;
		}
		.sgml-controls{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
		.sgml-feedback{font-size:14px;font-weight:bold}
		.sgml-feedback.correct{color:var(--correct-color)}
		.sgml-feedback.incorrect{color:var(--incorrect-color)}
		.sgml-order-list{list-style:none;padding:0;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
		.sgml-order-item{
			display:flex;align-items:center;justify-content:space-between;padding:6px 10px;
			border:1px solid var(--border-color);border-radius:3px;background:#fff;cursor:grab;gap:8px;
		}
		.sgml-order-item.dragging{opacity:.4}
		.sgml-item-actions{display:flex;gap:4px;flex:0 0 auto}
		.sgml-item-actions button{padding:2px 6px;font-size:12px}
		.sgml-enum-row{display:flex;align-items:center;gap:8px}

		.sgml-connect{padding:0}
		.sgml-connect .sgml-qtitle{padding:12px 14px 0;margin:0}
		.sgml-connect-board{
			position:relative;
			display:grid;
			grid-template-columns:minmax(0,1fr) minmax(0,1fr);
			gap:60px;
			padding:18px 18px 22px;
			min-height:250px;
		}
		.sgml-connect-lines{
			position:absolute;
			inset:0;
			width:100%;
			height:100%;
			pointer-events:none;
			z-index:1;
			overflow:visible;
		}
		.sgml-connect-column{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;min-width:0}
		.sgml-connect-item p{margin:0}
		.sgml-connect-heading{font-size:12px;font-weight:700;color:#666;text-align:center;margin-bottom:2px}
		.sgml-connect-item{
			position:relative;
			width:100%;
			min-height:44px;
			padding:10px 12px;
			border:1px solid #aaa;
			border-radius:7px;
			background:#fff;
			display:flex;
			align-items:center;
			justify-content:center;
			text-align:center;
			cursor:pointer;
			user-select:none;
			-webkit-user-select:none;
			touch-action:manipulation;
			transition:.12s ease;
		}
		.sgml-connect-item.selected{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.15);background:#eff6ff}
		.sgml-connect-item.matched{background:#f8fafc}
		.sgml-connect-item.flash-wrong{animation:sgmlConnectWrongFlash .62s ease}
		@keyframes sgmlConnectWrongFlash{
			0%,100%{background:#fff;border-color:#aaa;box-shadow:none}
			25%{background:#fee2e2;border-color:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.16)}
			55%{background:#fecaca;border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.13)}
		}
		.sgml-connect-item .idx{position:absolute;top:3px;font:10px monospace;color:#999}
		.sgml-connect-item.left .idx{left:5px}
		.sgml-connect-item.right .idx{right:5px}
		.sgml-connect-status{font-size:12px;color:#666;padding:0 14px 10px}
		.sgml-connect .sgml-controls{padding:0 14px 14px}

		.sgml-flashcard{padding:0}
		.sgml-flashcard-title p{margin:0}
		.sgml-flashcard-card p{margin:0}
		.sgml-flashcard-title{padding:12px 14px 0;font-weight:600}
		.sgml-flashcard-progress{padding:8px 14px 10px;color:#666;font-size:12px}
		.sgml-flashcard-card{
			position:relative;
			margin:0 14px 12px;
			min-height:180px;
			padding:28px 22px;
			border:1px solid #bbb;
			border-radius:10px;
			background:#fff;
			box-shadow:0 2px 8px rgba(0,0,0,.06);
			cursor:pointer;
			user-select:none;
			-webkit-user-select:none;
			touch-action:manipulation;
			display:flex;
			align-items:center;
			justify-content:center;
			text-align:center;
			outline:none;
		}
		.sgml-flashcard-card:focus-visible{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.14)}
		.sgml-flashcard-card.revealed{background:#f8fbff;border-color:#9eb7e8}
		.sgml-flashcard-face{width:100%}
		.sgml-flashcard-front{font-size:17px;font-weight:600}
		.sgml-flashcard-back{margin-top:14px;padding-top:14px;border-top:1px solid #d9e0ea}
		.sgml-flashcard-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#777;margin-bottom:5px}
		.sgml-flashcard-card:not(.revealed) .sgml-flashcard-back{display:none}
		.sgml-flashcard-hint{font-size:12px;color:#777;margin-top:12px}
		.sgml-flashcard .sgml-controls{padding:0 14px 14px}
		.sgml-flashcard-summary{padding:0 14px 14px;color:#444;font-size:13px}
		.sgml-flashcard-summary strong{font-weight:700}

		.sgml-spoiler{
			position:relative;
			display:inline-block;
			vertical-align:baseline;
			width:fit-content;
			max-width:100%;
		}
		.sgml-spoiler-content{display:block;width:fit-content;max-width:100%}
		.sgml-spoiler-content p{margin:0}
		.sgml-spoiler-content img,.sgml-spoiler-content video,.sgml-spoiler-content canvas,.sgml-spoiler-content svg{max-width:100%;height:auto}
		.sgml-spoiler-overlay{
			position:absolute;
			inset:0;
			display:block;
			width:100%;
			height:100%;
			margin:0;
			padding:0;
			border:0;
			border-radius:inherit;
			background:rgba(40,40,40,1);
			box-shadow:none;
			cursor:pointer;
			touch-action:manipulation;
			z-index:2;
		}
		.sgml-spoiler-overlay:active{background:rgba(55,55,55,1)}
		.sgml-spoiler-revealed .sgml-spoiler-overlay{display:none}
		.sgml-modal-backdrop{
			position:fixed;inset:0;background:var(--modal-overlay);display:none;align-items:center;
			justify-content:center;padding:16px;z-index:9999;
		}
		.sgml-modal-backdrop.open{display:flex}
		.sgml-modal-backdrop.confirm-layer{z-index:10001}
		.sgml-modal{
			width:min(100%,520px);max-height:min(90vh,720px);background:#fff;border:1px solid #888;
			border-radius:5px;box-shadow:0 12px 35px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-direction:column;
		}
		.sgml-modal-header{padding:12px 14px;border-bottom:1px solid var(--border-color);font-weight:700;flex:0 0 auto}
		.sgml-modal-body{padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
		.sgml-modal-footer{padding:10px 14px;border-top:1px solid var(--border-color);display:flex;justify-content:flex-end;gap:8px;flex:0 0 auto}
		.sgml-modal-message{white-space:pre-wrap;word-break:break-word}
		.sgml-library-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
		.sgml-library-item{width:100%;border:1px solid var(--border-color);border-radius:4px;background:#fff;padding:10px;text-align:left;display:flex;align-items:center;gap:8px}
		.sgml-library-load{min-width:0;flex:1;border:0;background:transparent;padding:0;text-align:left}
		.sgml-library-item-title{font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
		.sgml-library-item-preview{color:#555;font-family:monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
		.sgml-library-delete{flex:0 0 auto;width:32px;height:32px;padding:0;border:0;border-radius:4px;background:#dc2626;color:#fff;font-size:20px;font-weight:700;line-height:32px;text-align:center}
		.sgml-library-delete:active{background:#b91c1c}
		.sgml-library-empty{color:#666;padding:10px 0}
		.sgml-current-name{margin-top:7px;font-size:12px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

		.sgml-info-wrap{
			display:inline-flex;
			align-items:center;
			vertical-align:baseline;
			position:relative;
		}
		.sgml-info-trigger{
			display:inline-flex;
			align-items:center;
			justify-content:center;
			width:1.15em;
			height:1.15em;
			padding:0;
			border:0;
			background:transparent;
			color:#8a8a8a;
			font-size:1em;
			line-height:1;
			font-family:inherit;
			text-decoration:underline;
			text-decoration-thickness:1px;
			text-underline-offset:2px;
			cursor:pointer;
			touch-action:manipulation;
		}
		.sgml-info-trigger:hover{color:#666}
		.sgml-question-literal{white-space:pre-wrap}
		.sgml-info-trigger:focus-visible{outline:1px solid #aaa;outline-offset:2px;border-radius:3px}
		.sgml-info-panel{
			position:absolute;
			width:min(340px,calc(100vw - 20px));
			max-height:min(380px,60vh);
			overflow:auto;
			padding:0;
			background:var(--sgml-info-bg,#fff);
			color:var(--sgml-info-col,#111);
			border:1px solid #cfcfcf;
			border-radius:5px;
			box-shadow:0 8px 24px rgba(0,0,0,.16);
			z-index:100000;
			font-size:14px;
			line-height:1.5;
		}
		.sgml-info-panel::before{
			content:"";
			position:absolute;
			left:var(--sgml-info-arrow-left,10px);
			top:-5px;
			width:8px;
			height:8px;
			background:var(--sgml-info-bg,#fff);
			border-left:1px solid #cfcfcf;
			border-top:1px solid #cfcfcf;
			transform:rotate(45deg);
		}
		.sgml-info-header{
			padding:8px 10px;
			border-bottom:1px solid #e1e1e1;
			background:var(--sgml-info-bg,#f8f8f8);
			color:var(--sgml-info-col,#666);
			font-size:12px;
			font-weight:600;
		}
		.sgml-info-body{padding:10px;color:var(--sgml-info-col,#111)}
		.sgml-info-body p:last-child{margin-bottom:0}
		.sgml-info-body img,.sgml-info-body svg,.sgml-info-body canvas,.sgml-info-body video{max-width:100%;height:auto}
		.sgml-info-body pre{max-width:100%;overflow:auto}
		.sgml-info-body table{max-width:100%;border-collapse:collapse}
		.sgml-info-body th,.sgml-info-body td{border:1px solid #d8dce2;padding:5px 8px}

		.sgml-icb{
			width:100%;max-width:100%;min-width:0;height:320px;min-height:160px;
			max-height:calc(100vh - 32px);margin:16px 0;border:1px solid #cfcfcf;border-radius:5px;
			background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column;position:relative;
		}
		.sgml-icb-header{
			flex:0 0 36px;height:36px;padding:8px 11px;border-bottom:1px solid #d8d8d8;
			background:#f8f8f8;color:#222;font-size:13px;font-weight:600;line-height:19px;
			white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
		}
		.sgml-icb-content{flex:1 1 auto;min-height:0;width:100%;background:#fff;overflow:hidden}
		.sgml-icb-content iframe{display:block;width:100%;height:100%;border:0;background:#fff}
		.sgml-icb-footer{
			flex:0 0 11px;height:11px;position:relative;background:#f4f4f4;border-top:1px solid #d8d8d8;
			cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;
		}
		.sgml-icb-footer::before{
			content:"";position:absolute;width:34px;height:3px;border-radius:3px;background:#a9a9a9;
			left:50%;top:50%;transform:translate(-50%,-50%);
		}
		.sgml-icb-footer:hover::before,.sgml-icb-footer.dragging::before{background:#777}

		.sgml-visual{
			width:100%;
			margin:16px 0;
			border:1px solid #cfcfcf;
			border-radius:5px;
			background:#fff;
			box-shadow:0 2px 8px rgba(0,0,0,.08);
			overflow:hidden;
			display:flex;
			flex-direction:column;
			position:relative;
			min-height:220px;
			resize:none;
		}
		.sgml-visual-header{
			flex:0 0 36px;
			height:36px;
			padding:8px 11px;
			border-bottom:1px solid #d8d8d8;
			background:#f8f8f8;
			color:#222;
			font-size:13px;
			font-weight:600;
			line-height:19px;
			white-space:nowrap;
			overflow:hidden;
			text-overflow:ellipsis;
		}
		.sgml-visual-content{
			flex:1 1 auto;
			min-height:160px;
			overflow:auto;
			padding:18px;
			-webkit-overflow-scrolling:touch;
		}
		.sgml-visual-footer{
			flex:0 0 11px;height:11px;position:relative;background:#f4f4f4;border-top:1px solid #d8d8d8;
			cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;
		}
		.sgml-visual-footer::before{
			content:"";position:absolute;width:34px;height:3px;border-radius:3px;background:#a9a9a9;
			left:50%;top:50%;transform:translate(-50%,-50%);
		}
		.sgml-visual-footer:hover::before,.sgml-visual-footer.dragging::before{background:#777}

		.sgml-tree-canvas{
			position:relative;
			min-width:0;
			min-height:0;
			padding:12px;
			overflow:auto;
			-webkit-overflow-scrolling:touch;
		}
		.sgml-tree{
			position:relative;
			width:max-content;
			min-width:680px;
			min-height:190px;
			padding:30px;
		}
		.sgml-tree-svg{
			position:absolute;
			inset:0;
			width:100%;
			height:100%;
			pointer-events:none;
			overflow:visible;
			z-index:0;
		}
		.sgml-tree-path{
			fill:none;
			stroke:#a0a7b0;
			stroke-width:2;
			stroke-linecap:round;
		}
		.sgml-tree-nodes{
			position:relative;
			z-index:2;
			display:flex;
			justify-content:center;
			align-items:flex-start;
			width:max-content;
			min-width:100%;
		}
		.sgml-tree-node{
			display:flex;
			flex-direction:column;
			align-items:center;
			position:relative;
		}
		.sgml-tree-card{
			width:min(360px,calc(100vw - 64px));
			min-width:220px;
			padding:14px;
			border:1px solid #d0d4d9;
			border-radius:9px;
			background:#fff;
			box-shadow:0 2px 8px rgba(0,0,0,.07);
			cursor:pointer;
			position:relative;
			z-index:3;
			transition:border-color .15s ease,box-shadow .15s ease;
		}
		.sgml-tree-card:hover{border-color:#a9afb7}
		.sgml-tree-card.expanded{border-color:#2563eb;box-shadow:0 3px 12px rgba(37,99,235,.1)}
		.sgml-tree-children{
			display:none;
			margin-top:62px;
			gap:36px;
			justify-content:center;
			align-items:flex-start;
			position:relative;
			width:max-content;
		}
		.sgml-tree-node.expanded>.sgml-tree-children{display:flex}
		.sgml-tree-child{display:flex;justify-content:center;position:relative}
		.sgml-tree-card-content h1,.sgml-tree-card-content h2,.sgml-tree-card-content h3,.sgml-tree-card-content h4,.sgml-tree-card-content h5,.sgml-tree-card-content h6{
			margin-top:0;margin-bottom:7px
		}
		.sgml-tree-card-content p{margin:0 0 9px}
		.sgml-tree-card-content p:last-child{margin-bottom:0}
		.sgml-tree-card-content img,.sgml-tree-card-content svg,.sgml-tree-card-content canvas,.sgml-tree-card-content video{max-width:100%}

	<script>
		window.MathJax={
			typeset:false,
			tex:{
				inlineMath:[['$','$'],['\\(','\\)']],
				displayMath:[['$$','$$'],['\\[','\\]']],
				processEscapes:true,
				processEnvironments:true
			},
			options:{
				skipHtmlTags:['script','noscript','style','textarea','pre','code'],

	</script>
	<script src="./tex-chtml.js"></script>

	<script>
		const STORAGE_DOCS='sgml_viewer_documents';
		const STORAGE_CURRENT_ID='sgml_viewer_current_id';
		const STORAGE_CURRENT_CONTENT='sgml_viewer_current_sgml';

		let parsedQuestions={};
		let currentDocumentId=null;
		let customComponentCounter=0;
		let sgmlSpoilerIdCounter=0;
		let questionCounter=0;
		let infoCounter=0;
		let openInfoWrap=null;

		function makeId(){
			return 'sgml_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);
		}

		function loadDocuments(){
			try{
				const raw=localStorage.getItem(STORAGE_DOCS);
				if(!raw)return[];
				const docs=JSON.parse(raw);
				return Array.isArray(docs)?docs:[];
			}catch(error){
				console.error('Could not load SGML library:',error);
				return[];
			}
		}

		function saveDocuments(docs){
			localStorage.setItem(STORAGE_DOCS,JSON.stringify(docs));
		}

		function getCurrentDocument(){
			return loadDocuments().find(doc=>doc.id===currentDocumentId)||null;
		}

		function setCurrentDocumentId(id){
			currentDocumentId=id;
			localStorage.setItem(STORAGE_CURRENT_ID,id);
		}

		function saveCurrentSGML(nameOverride=null){
			const input=document.getElementById('sgml-input');
			const content=input?input.value:'';
			let docs=loadDocuments();
			let doc=docs.find(item=>item.id===currentDocumentId);

			if(!doc){
				doc={
					id:makeId(),
					title:nameOverride||'Untitled SGML',
					content:'',
					createdAt:Date.now(),
					updatedAt:Date.now()
				};
				docs.push(doc);
				setCurrentDocumentId(doc.id);
			}

			if(nameOverride!==null)doc.title=nameOverride;
			doc.content=content;
			doc.updatedAt=Date.now();
			saveDocuments(docs);
			localStorage.setItem(STORAGE_CURRENT_CONTENT,content);
			updateCurrentName(doc);
		}

		function loadDocumentIntoEditor(doc){
			if(!doc)return;
			setCurrentDocumentId(doc.id);
			document.getElementById('sgml-input').value=doc.content||'';
			localStorage.setItem(STORAGE_CURRENT_CONTENT,doc.content||'');
			updateCurrentName(doc);
			renderSGML(doc.content||'');
		}

		function updateCurrentName(doc=getCurrentDocument()){
			const el=document.getElementById('sgml-current-name');
			if(!el)return;
			el.textContent=doc?`Current SGML: ${doc.title}`:'';
			el.title=doc?doc.title:'';
		}

		function setupAutosave(){
			const input=document.getElementById('sgml-input');
			input.addEventListener('input',()=>saveCurrentSGML());
		}

		function confirmDialog(message,title='Confirm',confirmText='Confirm'){
			return new Promise(resolve=>{
				const backdrop=document.getElementById('confirm-modal');
				const titleEl=document.getElementById('confirm-title');
				const messageEl=document.getElementById('confirm-message');
				const okBtn=document.getElementById('confirm-ok');
				const cancelBtn=document.getElementById('confirm-cancel');

				titleEl.textContent=title;
				messageEl.textContent=message;
				okBtn.textContent=confirmText;
				backdrop.classList.add('open');
				backdrop.setAttribute('aria-hidden','false');

				let finished=false;
				const finish=value=>{
					if(finished)return;
					finished=true;
					backdrop.classList.remove('open');
					backdrop.setAttribute('aria-hidden','true');
					okBtn.removeEventListener('click',onOk);
					cancelBtn.removeEventListener('click',onCancel);
					backdrop.removeEventListener('click',onBackdrop);
					document.removeEventListener('keydown',onKeyDown);
					resolve(value);
				};
				const onOk=()=>finish(true);
				const onCancel=()=>finish(false);
				const onBackdrop=event=>{if(event.target===backdrop)finish(false)};
				const onKeyDown=event=>{if(event.key==='Escape')finish(false)};

				okBtn.addEventListener('click',onOk);
				cancelBtn.addEventListener('click',onCancel);
				backdrop.addEventListener('click',onBackdrop);
				document.addEventListener('keydown',onKeyDown);
			});
		}

		let deferredInstallPrompt=null;

		function hidePWAInstallUI(){
			const banner=document.getElementById('pwa-install-banner');
			if(banner)banner.classList.remove('show');
		}

		function showPWAInstallUI(){
			if(!deferredInstallPrompt)return;
			if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true){
				hidePWAInstallUI();
				return;
			}
			const banner=document.getElementById('pwa-install-banner');
			if(banner)banner.classList.add('show');
		}

		async function promptPWAInstall(){
			if(!deferredInstallPrompt)return;

			const promptEvent=deferredInstallPrompt;
			deferredInstallPrompt=null;
			hidePWAInstallUI();

			try{
				await promptEvent.prompt();
				await promptEvent.userChoice;
			}catch(error){
				console.warn('PWA install prompt failed:',error);
			}
		}

		function setupPWAInstallPrompt(){
			window.addEventListener('beforeinstallprompt',event=>{
				event.preventDefault();
				deferredInstallPrompt=event;
				showPWAInstallUI();
			});

			window.addEventListener('appinstalled',()=>{
				deferredInstallPrompt=null;
				hidePWAInstallUI();
			});

			const installButton=document.getElementById('pwa-install-button');
			if(installButton){
				installButton.addEventListener('click',promptPWAInstall);
			}

			const dismissButton=document.getElementById('pwa-install-dismiss');
			if(dismissButton){
				dismissButton.addEventListener('click',()=>hidePWAInstallUI());
			}
		}

		async function getServiceWorkerRegistration(){
			if(!('serviceWorker' in navigator))return null;
			try{return await navigator.serviceWorker.getRegistration('./')}
			catch(error){console.error(error);return null}
		}

		function waitForController(timeout=5000){
			if(navigator.serviceWorker.controller)return Promise.resolve();

			return new Promise(resolve=>{
				let done=false;
				const finish=()=>{
					if(done)return;
					done=true;
					navigator.serviceWorker.removeEventListener('controllerchange',finish);
					clearTimeout(timer);
					resolve();
				};
				const timer=setTimeout(finish,timeout);
				navigator.serviceWorker.addEventListener('controllerchange',finish);
			});
		}

		async function cacheCurrentPageWithServiceWorker(registration){
			await waitForController();
			const worker=navigator.serviceWorker.controller||registration.active||registration.waiting||registration.installing;
			if(!worker)throw new Error('Service Worker is not active yet.');

			await new Promise((resolve,reject)=>{
				const channel=new MessageChannel();
				const timeout=setTimeout(()=>reject(new Error('Offline cache request timed out.')),10000);
				channel.port1.onmessage=event=>{
					clearTimeout(timeout);
					if(event.data&&event.data.ok)resolve();
					else reject(new Error(event.data&&event.data.error?event.data.error:'Offline cache failed.'));
				};
				worker.postMessage({type:'CACHE_URL',url:location.href},[channel.port2]);
			});
		}

		async function setOfflineWorkerState(enabled){
			const registration=await getServiceWorkerRegistration();
			const worker=
				navigator.serviceWorker.controller||
				(registration&&(
					registration.active||
					registration.waiting||
					registration.installing
				));

			if(!worker)return;

			await new Promise((resolve,reject)=>{
				const channel=new MessageChannel();
				const timeout=setTimeout(
					()=>{
						reject(
							new Error(
								'Offline state request timed out.'
							)
						);
					},
					5000
				);

				channel.port1.onmessage=event=>{
					clearTimeout(timeout);

					if(
						event.data&&
						event.data.ok
					){
						resolve();
					}else{
						reject(
							new Error(
								event.data&&event.data.error
									?event.data.error
									:'Offline state update failed.'
							)
						);
					}
				};

				worker.postMessage(
					{
						type:'SET_OFFLINE_ENABLED',
						enabled:!!enabled
					},
					[channel.port2]
				);
			});
		}

		async function registerPWAServiceWorker(){
			if(!('serviceWorker' in navigator))return null;

			try{
				const registration=await navigator.serviceWorker.register(
					'./sw.js',
					{scope:'./'}
				);

				await registration.update();

				if(registration.waiting){
					registration.waiting.postMessage({
						type:'SKIP_WAITING'
					});
				}

				await waitForController(6000);
				return registration;
			}catch(error){
				console.error(
					'PWA Service Worker registration failed:',
					error
				);
				return null;
			}
		}

		async function enableOffline(){
			if(!('serviceWorker' in navigator)){
				await confirmDialog(
					'This browser/WebView does not support Service Workers, so Offline mode cannot be enabled here.',
					'Offline unavailable',
					'OK'
				);
				return;
			}

			try{
				await registerPWAServiceWorker();

				localStorage.setItem(
					'sgml_viewer_offline_enabled',
					'1'
				);

				await setOfflineWorkerState(true);

				const registration=
					await getServiceWorkerRegistration();

				await waitForController(6000);
				await cacheCurrentPageWithServiceWorker(
					registration
				);

				updateOfflineButton(true);

				await confirmDialog(
					'Offline mode is enabled. This browser page can now be opened from its offline cache.',
					'Offline enabled',
					'OK'
				);
			}catch(error){
				console.error(
					'Offline setup failed:',
					error
				);

				localStorage.removeItem(
					'sgml_viewer_offline_enabled'
				);

				await confirmDialog(
					'Offline mode could not be enabled. Make sure this page is being served from HTTP(S) and that sw.js is in the same folder.',
					'Offline setup failed',
					'OK'
				);
			}
		}
		async function disableOfflineAndRefresh(){
			const confirmed=await confirmDialog(
				'This will update to the most recent browser page and remove this page from its offline cache.\n\nAfter this, Offline mode will be disabled until you enable it again.',
				'Refresh browser?',
				'Refresh'
			);

			if(!confirmed)return;

			try{
				localStorage.removeItem(
					'sgml_viewer_offline_enabled'
				);

				const registration=
					await getServiceWorkerRegistration();

				if(registration){
					try{
						await setOfflineWorkerState(false);
					}catch(error){
						console.warn(
							'Could not disable Service Worker offline caching:',
							error
						);
					}
				}

				if('caches' in window){
					const keys=await caches.keys();

					await Promise.all(
						keys
							.filter(key=>
								key.startsWith(
									'sgml-viewer-offline-'
								)
							)
							.map(key=>caches.delete(key))
					);
				}

				updateOfflineButton(false);

				const url=new URL(location.href);
				url.searchParams.set(
					'__sgml_refresh',
					String(Date.now())
				);
				location.replace(url.href);
			}catch(error){
				console.error(
					'Refresh cleanup failed:',
					error
				);

				const url=new URL(location.href);
				url.searchParams.set(
					'__sgml_refresh',
					String(Date.now())
				);
				location.replace(url.href);
			}
		}

		async function handleOfflineButton(){
			const button=document.getElementById('offline-button');

			if(button.dataset.mode==='refresh')await disableOfflineAndRefresh();
			else await enableOffline();
		}

		function updateOfflineButton(enabled){
			const button=document.getElementById('offline-button');
			button.textContent=enabled?'Refresh':'Enable Offline';
			button.dataset.mode=enabled?'refresh':'enable';
		}

		async function updateOfflineButtonFromState(){
			const enabled=
				localStorage.getItem(
					'sgml_viewer_offline_enabled'
				)==='1';

			updateOfflineButton(enabled);

			if(!('serviceWorker' in navigator)){
				return;
			}

			try{
				const registration=
					await getServiceWorkerRegistration();

				if(!registration){
					await registerPWAServiceWorker();
				}

				await setOfflineWorkerState(enabled);
			}catch(error){
				console.warn(
					'Could not sync offline state:',
					error
				);
			}
		}

        function isSGMLEscapable(char){
            return "\\`,|[](){}<>".includes(char);
        }

        function decodeSGMLEscapes(str){
            if(!str)return'';
            let result='';

            for(let i=0;i<str.length;i++){
                const c=str[i];

                if(c==='\\'&&i+1<str.length&&isSGMLEscapable(str[i+1])){
                    result+=str[i+1];
                    i++;
                    continue;
                }

                result+=c;
            }

            return result;
        }

        let sgmlLiteralStore=[];
        let sgmlEscapedStore=[];

        function maskLiteralStrings(source){
            const text=String(source||'');
            let result='';
            let literal='';
            let inLiteral=false;

            const finishLiteral=()=>{
                const index=sgmlLiteralStore.length;
                sgmlLiteralStore.push(literal);
                result+=`\uE500SGMLLIT${index}\uE501`;
                literal='';
            };

            const maskEscaped=char=>{
                const index=sgmlEscapedStore.length;
                sgmlEscapedStore.push(char);
                result+=`\uE700SGMLESC${index}\uE701`;
            };

            for(let i=0;i<text.length;i++){
                const c=text[i];

                if(inLiteral){
                    if(c==='\\'&&i+1<text.length&&isSGMLEscapable(text[i+1])){
                        literal+=c+text[i+1];
                        i++;
                        continue;
                    }

                    if(c==='`'){
                        finishLiteral();
                        inLiteral=false;
                        continue;
                    }

                    literal+=c;
                    continue;
                }

                if(c==='\\'&&i+1<text.length&&isSGMLEscapable(text[i+1])){
                    maskEscaped(text[i+1]);
                    i++;
                    continue;
                }

                if(c==='`'){
                    inLiteral=true;
                    continue;
                }

                result+=c;
            }

            if(inLiteral)finishLiteral();
            return result;
        }

        function restoreLiteralHTML(str){
            return String(str||'').replace(
                /\uE500SGMLLIT(\d+)\uE501/g,
                (_,i)=>`<span class="sgml-question-literal">${escapeHTMLText(decodeSGMLEscapes(sgmlLiteralStore[Number(i)]||''))}</span>`
            );
        }

        function restoreEscapedHTML(str){
            return String(str||'').replace(
                /\uE700SGMLESC(\d+)\uE701/g,
                (_,i)=>escapeHTMLText(sgmlEscapedStore[Number(i)]||'')
            );
        }

        function extractTrueText(rawStr,{stripMarkup=true}={}){
            if(rawStr===undefined||rawStr===null)return'';

            const literalTokens=[];
            const escapedTokens=[];
            let str=String(rawStr);

            str=str.replace(
                /\uE500SGMLLIT(\d+)\uE501/g,
                (_,i)=>{
                    const token=`\uE600SGMLCMP${literalTokens.length}\uE601`;
                    literalTokens.push(sgmlLiteralStore[Number(i)]||'');
                    return token;
                }
            );

            str=str.replace(
                /\uE700SGMLESC(\d+)\uE701/g,
                (_,i)=>{
                    const token=`\uE800SGMLCMP${escapedTokens.length}\uE801`;
                    escapedTokens.push(sgmlEscapedStore[Number(i)]||'');
                    return token;
                }
            );

            if(stripMarkup){
                str=str
                    .replace(/<st\b[^>]*>/gi,'')
                    .replace(/<\/st>/gi,'')
                    .replace(/<([a-z][a-z0-9:-]*)\b[^>]*>([\s\S]*?)<\/\1>/gi,'$2')
                    .replace(/<\/?[a-z][a-z0-9:-]*\s*\/?>/gi,match=>{
                        const name=(match.match(/^<\/?([a-z][a-z0-9:-]*)/i)||[])[1]||'';
                        return /^br$/i.test(name)||/^hr$/i.test(name)?'':match;
                    });
            }

            str=str.replace(
                /\uE600SGMLCMP(\d+)\uE601/g,
                (_,i)=>decodeSGMLEscapes(literalTokens[Number(i)]||'')
            );

            str=str.replace(
                /\uE800SGMLCMP(\d+)\uE801/g,
                (_,i)=>escapedTokens[Number(i)]||''
            );

            str=decodeSGMLEscapes(str);
            str=str.replace(/[*_~`#]/g,'');
            return str.trim();
        }

		function splitByChar(str,charToSplit){
			if(!str)return[];

			const result=[];
			let current='';
			let depth=0;
			let inBackticks=false;

			for(let i=0;i<str.length;i++){
				const c=str[i];

				if(c==='\\'&&i+1<str.length&&isSGMLEscapable(str[i+1])){
					current+=c+str[i+1];
					i++;
					continue;
				}

				if(c==='`'){
					inBackticks=!inBackticks;
					current+=c;
					continue;
				}

				if(!inBackticks){
					if(c==='<'||c==='['||c==='('||c==='{')depth++;
					else if(c==='>'||c===']'||c===')'||c==='}')depth--;

					if(c===charToSplit&&depth===0){
						result.push(current.trim());
						current='';
						continue;
					}
				}

				current+=c;
			}

			if(current.trim())result.push(current.trim());
			return result;
		}

		function extractBalanced(text,startIdx,openChar,closeChar){
			let count=0;
			let content='';
			let inBackticks=false;

			for(let i=startIdx;i<text.length;i++){
				const c=text[i];

				if(c==='\\'&&i+1<text.length&&isSGMLEscapable(text[i+1])){
					content+=c+text[i+1];
					i++;
					continue;
				}

				if(c==='`'){
					inBackticks=!inBackticks;
					content+=c;
					continue;
				}

				if(inBackticks){
					content+=c;
					continue;
				}

				if(c===openChar){
					count++;
					if(count===1)continue;
				}

				if(c===closeChar){
					count--;
					if(count===0)return{content,nextIdx:i+1};
				}

				if(count>0)content+=c;
			}

			return null;
		}

		function findTagStart(source,tag,from=0){
			const re=new RegExp(`<${tag}\\b[^>]*>`,`gi`);
			re.lastIndex=from;
			const match=re.exec(source);
			return match?{index:match.index,end:re.lastIndex,open:match[0]}:null;
		}

		function findMatchingTag(source,tag,startIndex,allowNested=true){
			const tokenRegex=new RegExp(`</?${tag}\\b[^>]*>`,`gi`);
			tokenRegex.lastIndex=startIndex;

			let depth=1;
			let match;

			while((match=tokenRegex.exec(source))!==null){
				const token=match[0];

				if(/^<\//.test(token)){
					depth--;

					if(depth===0){
						return{
							content:source.slice(startIndex,match.index),
							end:tokenRegex.lastIndex
						};
					}
				}else if(allowNested){
					depth++;
				}
			}

			return null;
		}

		function extractChildren(source,tag,allowNested=false){
			const children=[];
			const spans=[];
			let pos=0;

			while(pos<source.length){
				const found=findTagStart(source,tag,pos);

				if(!found)break;

				const matched=findMatchingTag(
					source,
					tag,
					found.end,
					allowNested
				);

				if(!matched)break;

				children.push({
					open:found.open,
					content:matched.content,
					start:found.index,
					end:matched.end
				});

				spans.push({
					start:found.index,
					end:matched.end
				});

				pos=matched.end;
			}

			return{children,spans};
		}

		function removeSpans(source,spans){
			if(!spans.length)return source;

			let result='';
			let cursor=0;

			spans
				.sort((a,b)=>a.start-b.start)
				.forEach(span=>{
					result+=source.slice(cursor,span.start);
					result+='\n';
					cursor=span.end;
				});

			result+=source.slice(cursor);
			return result;
		}

		function extractICBBlocks(inputStr){
			const blocks=[];

			if(!inputStr){
				return{processedText:'',blocks};
			}

			const regex=/^~~~([^\r\n~][^\r\n]*)\r?\n([\s\S]*?)^~~~[ 	]*(?=\r?$|\n)/gm;

			const processedText=String(inputStr).replace(
				regex,
				(match,name,content)=>{
					const index=blocks.length;

					blocks.push({
						name:String(name||'ICB').trim()||'ICB',
						content:String(content||'')
					});

					return`\uE100SGMLICB${index}\uE101`;
				}
			);

			return{processedText,blocks};
		}

		function buildICBDocument(content){
			const baseHref=escapeHTMLAttribute(location.href);
			const source=String(content||'');
			const trimmed=source.trim();

			if(/^<!doctype\s+html/i.test(trimmed)||/<html\b/i.test(trimmed)){
				return source;
			}

			return`<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<base href="${baseHref}">
<style>
html,body{margin:0;padding:0;min-width:0;min-height:100%;width:100%;box-sizing:border-box}
body{overflow:auto;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box}
img,video,canvas,svg{max-width:none}
table{max-width:none}
</style>
</head>
<body>${source}</body>
</html>`;
		}

		function setupICB(){
			const slots=document.querySelectorAll('.sgml-icb-slot');

			slots.forEach(slot=>{
				const index=Number(slot.dataset.icbIndex);
				const block=window.__sgmlICBBlocks&&window.__sgmlICBBlocks[index];

				if(!block)return;

				const container=document.createElement('div');
				container.className='sgml-icb';
				container.style.height='320px';

				const header=document.createElement('div');
				header.className='sgml-icb-header';
				header.textContent=block.name;
				header.title=block.name;

				const content=document.createElement('div');
				content.className='sgml-icb-content';

				const iframe=document.createElement('iframe');
				iframe.setAttribute('sandbox','allow-scripts');
				iframe.setAttribute('title',`${block.name} isolated container`);
				iframe.setAttribute('loading','lazy');
				iframe.srcdoc=buildICBDocument(block.content);

				content.appendChild(iframe);

				const footer=document.createElement('div');
				footer.className='sgml-icb-footer';
				footer.setAttribute('aria-label','Resize isolated container');
				footer.title='Drag to resize';

				container.appendChild(header);
				container.appendChild(content);
				container.appendChild(footer);
				slot.replaceWith(container);

				let dragging=false;
				let startY=0;
				let startHeight=320;
				let pointerId=null;

				const getMaxHeight=()=>Math.max(160,window.innerHeight-32);

				const onPointerMove=event=>{
					if(!dragging)return;
					if(pointerId!==null&&event.pointerId!==pointerId)return;

					const delta=event.clientY-startY;
					const newHeight=Math.max(
						160,
						Math.min(getMaxHeight(),startHeight+delta)
					);

					container.style.height=`${newHeight}px`;
				};

				const endDrag=event=>{
					if(pointerId!==null&&event.pointerId!==pointerId)return;

					dragging=false;
					footer.classList.remove('dragging');

					if(footer.hasPointerCapture&&pointerId!==null&&footer.hasPointerCapture(pointerId)){
						footer.releasePointerCapture(pointerId);
					}

					pointerId=null;

					window.removeEventListener('pointermove',onPointerMove);
					window.removeEventListener('pointerup',endDrag);
					window.removeEventListener('pointercancel',endDrag);
				};

				footer.addEventListener('pointerdown',event=>{
					event.preventDefault();

					dragging=true;
					startY=event.clientY;
					startHeight=container.getBoundingClientRect().height;
					pointerId=event.pointerId;
					footer.classList.add('dragging');

					if(footer.setPointerCapture){
						try{footer.setPointerCapture(event.pointerId)}catch(_){}
					}

					window.addEventListener('pointermove',onPointerMove);
					window.addEventListener('pointerup',endDrag);
					window.addEventListener('pointercancel',endDrag);
				});
			});
		}

		function renderST(str){
			if(!str)return'';

			return String(str)
				.replace(/<st\s+([^>]*?)>/gi,(m,a)=>{
					const rules=[];

					a.trim().split(/\s+/).forEach(p=>{
						const i=p.indexOf(':');
						if(i<0)return;

						let k=p.slice(0,i).trim();
						let v=p.slice(i+1).trim();

						if(k==='col')k='color';
						else if(k==='bg')k='background-color';
						else if(k==='fontSize')k='font-size';
						else if(k==='fontFamily')k='font-family';

						rules.push(`${k}:${v}`);
					});

					return`<span style="${rules.join(';')}">`;
				})
				.replace(/<\/st>/gi,'</span>');
		}

		function escapeHTMLAttribute(str){
			return String(str)
				.replace(/&/g,'&amp;')
				.replace(/"/g,'&quot;')
				.replace(/</g,'&lt;')
				.replace(/>/g,'&gt;');
		}

		function escapeHTMLText(str){
			return String(str)
				.replace(/&/g,'&amp;')
				.replace(/</g,'&lt;')
				.replace(/>/g,'&gt;')
				.replace(/"/g,'&quot;');
		}

		function renderMarkdown(mdText){
			if(!mdText)return'';

			const savedRefs=[];
			const saved=[];
			let source=String(mdText);

			source=maskLiteralStrings(source);

			source=source
				.replace(
					/<ref\s+id\s*:\s*"([^"]*)"\s*\/>/gi,
					(match,id)=>{
						const index=savedRefs.length;
						savedRefs.push({type:'target',id});
						return`\uE000SGMLREF${index}\uE001`;
					}
				)
				.replace(
					/<ref\s+id\s*:\s*"([^"]*)"\s*>([\s\S]*?)<\/ref>/gi,
					(match,id,content)=>{
						const index=savedRefs.length;
						savedRefs.push({type:'link',id,content});
						return`\uE000SGMLREF${index}\uE001`;
					}
				)
				.replace(
					/<st\b[^>]*>|<\/st>/gi,
					tag=>{
						const id=saved.length;
						saved.push(tag);
						return`\uE000SGMLST${id}\uE001`;
					}
				);

			let result=marked.parse(source,{gfm:true,breaks:true});

			result=result.replace(
				/\uE000SGMLST(\d+)\uE001/g,
				(_,i)=>saved[Number(i)]||''
			);

			result=result.replace(
				/\uE000SGMLREF(\d+)\uE001/g,
				(_,i)=>{
					const ref=savedRefs[Number(i)];
					if(!ref)return'';

					const id=escapeHTMLAttribute(ref.id);
					if(ref.type==='target')return`<a id="${id}" class="sgml-ref"></a>`;
					return`<a href="#${id}" class="sgml-ref">${renderMarkdown(ref.content)}</a>`;
				}
			);

			result=restoreLiteralHTML(result);
			result=restoreEscapedHTML(result);
			return renderST(result);
		}

		function buildQuestionUI(q){
			if(q.type==='choices')return buildChoicesHTML(q);
			if(q.type==='fillin')return buildFillinHTML(q);
			if(q.type==='enumeration')return buildEnumerationHTML(q);
			if(q.type==='connect')return buildConnectHTML(q);
			if(q.type==='flashcard')return buildFlashcardHTML(q);
			return'';
		}

		function parseQuestionBlocks(inputStr){
			const questions=[];
			let i=0;
			let output='';

			while(i<inputStr.length){
				const connectMatch=inputStr.slice(i).match(/^<connect\s*:\s*/i);
				const flashMatch=inputStr.slice(i).match(/^<flashcard\s*:?\s*/i);
				const normalMatch=inputStr.slice(i).match(/^<(Choices|Fillin|Enumeration):/i);

				if(connectMatch){
					try{
						const parsed=parseConnectAt(inputStr,i);
						if(parsed){
							const qId='sgmlq'+questionCounter++;
							questions.push({
								id:qId,
								type:'connect',
								questionRaw:parsed.question,
								left:parsed.left,
								right:parsed.right,
								answers:parsed.answers,
								attrs:parsed.attrs
							});
							output+=`\n\n%%QBLOCKTOKEN${qId}%%\n\n`;
							i=parsed.end;
							continue;
						}
					}catch(error){
						console.error('Connect parse error:',error);
					}
				}

				if(flashMatch){
					try{
						const parsed=parseFlashcardAt(inputStr,i);
						if(parsed){
							const qId='sgmlq'+questionCounter++;
							questions.push({
								id:qId,
								type:'flashcard',
								title:parsed.title,
								questions:parsed.questions,
								answers:parsed.answers,
								attrs:parsed.attrs
							});
							output+=`\n\n%%QBLOCKTOKEN${qId}%%\n\n`;
							i=parsed.end;
							continue;
						}
					}catch(error){
						console.error('Flashcard parse error:',error);
					}
				}

				if(normalMatch){
					const type=normalMatch[1];
					let cur=i+normalMatch[0].length;
					while(cur<inputStr.length&&/\s/.test(inputStr[cur]))cur++;

					if(inputStr[cur]==='('){
						const qRes=extractBalanced(inputStr,cur,'(',')');
						if(qRes){
							cur=qRes.nextIdx;
							while(cur<inputStr.length&&/\s/.test(inputStr[cur]))cur++;

							if(inputStr[cur]==='['){
								const aRes=extractBalanced(inputStr,cur,'[',']');
								if(aRes){
									cur=aRes.nextIdx;
									while(cur<inputStr.length&&/\s/.test(inputStr[cur]))cur++;

									if(inputStr[cur]==='{'){
										const cRes=extractBalanced(inputStr,cur,'{','}');
										if(cRes){
											cur=cRes.nextIdx;
											while(cur<inputStr.length&&/\s/.test(inputStr[cur]))cur++;

											if(inputStr[cur]==='>'){
												cur++;
												const qId='sgmlq'+questionCounter++;
												questions.push({
													id:qId,
													type:type.toLowerCase(),
													questionRaw:qRes.content,
													answersRaw:aRes.content,
													correctAndPropsRaw:cRes.content
												});
												output+=`\n\n%%QBLOCKTOKEN${qId}%%\n\n`;
												i=cur;
												continue;
											}
										}
									}
								}
							}
						}
					}
				}

				output+=inputStr[i];
				i++;
			}

			return{processedText:output,questions};
		}

		function parsePropsAndAnswers(correctAndPropsRaw,answersList){
			const result={
				props:{
					case:false,
					inorder:false,
					count:null,
					type:null
				},
				correctAnswers:[]
			};

			const segments=splitByChar(correctAndPropsRaw,'|');

			segments.forEach(seg=>{
				const propMatch=seg.match(/^([a-zA-Z]+)\s*:\s*(.+)$/);

				if(propMatch){
					const key=propMatch[1].toLowerCase();
					const val=propMatch[2].trim().toLowerCase();

					if(key==='case')result.props.case=val==='true';
					else if(key==='inorder')result.props.inorder=val==='true';
					else if(key==='count')result.props.count=parseInt(val,10);
					else if(key==='type')result.props.type=val;
					else if(key==='order'&&val==='true')result.props.type='order';
				}else{
					const idxMatches=[...seg.matchAll(/\[idx:(\d+)\]/gi)];

					if(idxMatches.length){
						idxMatches.forEach(m=>{
							const idx=parseInt(m[1],10);
							if(answersList[idx]!==undefined)result.correctAnswers.push(answersList[idx]);
						});
					}else if(seg){
						result.correctAnswers.push(...splitByChar(seg,','));
					}
				}
			});

			if(result.correctAnswers.length===0&&answersList.length){
				result.correctAnswers=[...answersList];
			}

			return result;
		}

		function renderQuestionText(source){
			return renderEmbeddedSGML(String(source||''));
		}


		function splitTopLevelListFlexible(raw,char=','){
			return splitByChar(String(raw||''),char).filter(v=>v.trim()!=='');
		}

		function decodeInteractiveValue(raw){
			let value=String(raw===undefined||raw===null?'':raw).trim();
			if(value.length>=2&&value[0]==='`'&&value[value.length-1]==='`'){
				value=value.slice(1,-1);
			}
			return decodeSGMLEscapes(value);
		}

		function parseSimpleAttributeMap(raw){
			const attrs={};
			for(const part of splitByChar(String(raw||''),',')){
				if(!part)continue;
				const i=part.indexOf(':');
				if(i<0)continue;
				const key=part.slice(0,i).trim().toLowerCase();
				let value=part.slice(i+1).trim();
				if(/^true$/i.test(value))value=true;
				else if(/^false$/i.test(value))value=false;
				else if(/^[-+]?\d+(?:\.\d+)?$/.test(value))value=Number(value);
				attrs[key]=value;
			}
			return attrs;
		}

		function parseNestedBracketItems(raw){
			const text=String(raw||'').trim();
			const values=[];
			let pos=0;
			while(pos<text.length){
				while(pos<text.length&&/[\s,]/.test(text[pos]))pos++;
				if(pos>=text.length)break;
				if(text[pos]!=='[')return null;
				const part=extractBalanced(text,pos,'[',']');
				if(!part)return null;
				values.push(decodeInteractiveValue(part.content));
				pos=part.nextIdx;
			}
			return values.length?values:null;
		}

		function parseConnectColumnsIntegrated(raw){
			const first=extractBalanced(raw.trim(),0,'[',']');
			if(!first)throw new Error('Could not parse Connect column 1.');
			const rest=raw.slice(first.nextIdx).trim();
			const second=extractBalanced(rest,0,'[',']');
			if(!second)throw new Error('Could not parse Connect column 2.');

			const parseList=part=>splitByChar(part,',').map(decodeInteractiveValue);
			return{left:parseList(first.content),right:parseList(second.content)};
		}

		function parseConnectAnswersIntegrated(raw){
			const answers=[];
			let pos=0;
			while(pos<String(raw||'').length){
				const text=String(raw||'');
				while(pos<text.length&&/[\s,]/.test(text[pos]))pos++;
				if(pos>=text.length)break;
				if(text[pos]!=='['||text[pos+1]!=='['){
					throw new Error('Connect answers must use [[idx:n][idx:n]].');
				}
				const outer=extractBalanced(text,pos,'[',']');
				if(!outer)throw new Error('Unclosed Connect answer pair.');
				const inner=outer.content.trim();
				const a=extractBalanced(inner,0,'[',']');
				if(!a)throw new Error('Invalid first Connect answer index.');
				const b=extractBalanced(inner.slice(a.nextIdx).trim(),0,'[',']');
				if(!b)throw new Error('Invalid second Connect answer index.');
				const m1=a.content.match(/^\s*idx\s*:\s*(\d+)\s*$/i);
				const m2=b.content.match(/^\s*idx\s*:\s*(\d+)\s*$/i);
				if(!m1||!m2)throw new Error('Connect answers must use [idx:n][idx:n].');
				answers.push({left:Number(m1[1]),right:Number(m2[1])});
				pos=outer.nextIdx;
			}
			return answers;
		}

		function parseConnectAt(text,startIndex){
			const source=String(text||'');
			const head=source.slice(startIndex).match(/^<connect\s*:\s*/i);
			if(!head)return null;
			let cur=startIndex+head[0].length;

			while(/\s/.test(source[cur]||''))cur++;
			if(source[cur]!=='(')throw new Error('Connect is missing question (...).');
			const q=extractBalanced(source,cur,'(',')');
			if(!q)throw new Error('Unclosed Connect question.');
			cur=q.nextIdx;

			while(/\s/.test(source[cur]||''))cur++;
			if(source[cur]!=='[')throw new Error('Connect is missing columns [[...][...]].');
			const cols=extractBalanced(source,cur,'[',']');
			if(!cols)throw new Error('Unclosed Connect columns.');
			cur=cols.nextIdx;

			while(/\s/.test(source[cur]||''))cur++;
			if(source[cur]!=='{')throw new Error('Connect is missing attributes {...}.');
			const body=extractBalanced(source,cur,'{','}');
			if(!body)throw new Error('Unclosed Connect {...}.');
			cur=body.nextIdx;

			while(/\s/.test(source[cur]||''))cur++;
			if(source[cur]!=='>' )throw new Error('Connect is missing closing >.');
			cur++;

			const parts=splitByChar(body.content,'|');
			const answersPart=(parts.shift()||'').trim();
			const attrsRaw=parts.join('|').trim();
			const answersText=answersPart.replace(/^answers\s*:\s*/i,'').trim();
			const columns=parseConnectColumnsIntegrated(cols.content);
			const answers=parseConnectAnswersIntegrated(answersText);
			for(const pair of answers){
				if(pair.left<0||pair.left>=columns.left.length||pair.right<0||pair.right>=columns.right.length){
					throw new Error(`Connect answer index out of range: [${pair.left}] -> [${pair.right}]`);
				}
			}

			return{
				end:cur,
				question:decodeInteractiveValue(q.content),
				left:columns.left.map((value,index)=>({text:value,index})),
				right:columns.right.map((value,index)=>({text:value,index})),
				answers,
				attrs:parseSimpleAttributeMap(attrsRaw)
			};
		}

		function shuffleArrayCopy(array){
			const a=array.slice();
			for(let i=a.length-1;i>0;i--){
				const j=Math.floor(Math.random()*(i+1));
				[a[i],a[j]]=[a[j],a[i]];
			}
			return a;
		}

		function getConnectState(qId){
			const q=parsedQuestions[qId];
			return q&&q.type==='connect'?q:null;
		}

		function getConnectConnection(qId,side,index){
			const q=getConnectState(qId);
			if(!q)return null;
			return q.connections.find(pair=>pair[side]===index)||null;
		}

		function removeConnectConnection(qId,leftIdx,rightIdx){
			const q=getConnectState(qId);
			if(!q)return;
			q.connections=q.connections.filter(pair=>!(pair[0]===leftIdx&&pair[1]===rightIdx));
		}

		function toggleConnectLeft(qId,index){
			const q=getConnectState(qId);
			if(!q)return;
			const existing=getConnectConnection(qId,0,index);
			if(existing){
				removeConnectConnection(qId,existing[0],existing[1]);
				q.selectedLeft=null;
				q.selectedRight=null;
				drawConnectLines(qId);
				updateConnectItemClasses(qId);
				return;
			}
			q.selectedLeft=index;
			q.selectedRight=null;
			updateConnectItemClasses(qId);
		}

		function toggleConnectRight(qId,index){
			const q=getConnectState(qId);
			if(!q)return;
			const existing=getConnectConnection(qId,1,index);
			if(existing){
				removeConnectConnection(qId,existing[0],existing[1]);
				q.selectedLeft=null;
				q.selectedRight=null;
				drawConnectLines(qId);
				updateConnectItemClasses(qId);
				return;
			}
			if(q.selectedLeft===null)return;
			const old=getConnectConnection(qId,1,index);
			if(old)removeConnectConnection(qId,old[0],old[1]);
			removeConnectConnection(qId,q.selectedLeft,index);
			q.connections.push([q.selectedLeft,index]);
			q.selectedLeft=null;
			q.selectedRight=null;
			drawConnectLines(qId);
			updateConnectItemClasses(qId);
		}

		function updateConnectItemClasses(qId){
			const q=getConnectState(qId);
			const box=document.getElementById(qId);
			if(!q||!box)return;
			box.querySelectorAll('.sgml-connect-item.left').forEach(el=>{
				const idx=Number(el.dataset.idx);
				el.classList.toggle('selected',q.selectedLeft===idx);
				el.classList.toggle('matched',!!getConnectConnection(qId,0,idx));
			});
			box.querySelectorAll('.sgml-connect-item.right').forEach(el=>{
				const idx=Number(el.dataset.idx);
				el.classList.toggle('selected',q.selectedRight===idx);
				el.classList.toggle('matched',!!getConnectConnection(qId,1,idx));
			});
		}

		function drawConnectLines(qId){
			const q=getConnectState(qId);
			const box=document.getElementById(qId);
			if(!q||!box)return;
			const board=box.querySelector('.sgml-connect-board');
			const svg=box.querySelector('.sgml-connect-lines');
			if(!board||!svg)return;
			const rect=board.getBoundingClientRect();
			svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);
			svg.innerHTML='';
			for(const [li,ri] of q.connections){
				const left=box.querySelector(`.sgml-connect-item.left[data-idx="${li}"]`);
				const right=box.querySelector(`.sgml-connect-item.right[data-idx="${ri}"]`);
				if(!left||!right)continue;
				const a=left.getBoundingClientRect();
				const b=right.getBoundingClientRect();
				const x1=a.right-rect.left;
				const y1=a.top+a.height/2-rect.top;
				const x2=b.left-rect.left;
				const y2=b.top+b.height/2-rect.top;
				const bend=Math.max(24,(x2-x1)*0.45);
				const path=document.createElementNS('http://www.w3.org/2000/svg','path');
				path.setAttribute('d',`M ${x1} ${y1} C ${x1+bend} ${y1}, ${x2-bend} ${y2}, ${x2} ${y2}`);
				path.setAttribute('fill','none');
				path.setAttribute('stroke','#2563eb');
				path.setAttribute('stroke-width','3');
				path.setAttribute('stroke-linecap','round');
				svg.appendChild(path);
			}
			const status=box.querySelector('.sgml-connect-status');
			if(status)status.textContent=`${q.connections.length} connection${q.connections.length===1?'':'s'} made.`;
		}

		function flashWrongConnectPair(qId,leftIdx,rightIdx){
			const box=document.getElementById(qId);
			if(!box)return;
			const left=box.querySelector(`.sgml-connect-item.left[data-idx="${leftIdx}"]`);
			const right=box.querySelector(`.sgml-connect-item.right[data-idx="${rightIdx}"]`);
			[left,right].forEach(el=>{
				if(!el)return;
				el.classList.remove('flash-wrong');
				void el.offsetWidth;
				el.classList.add('flash-wrong');
				setTimeout(()=>el.classList.remove('flash-wrong'),700);
			});
		}

		function checkConnectAnswer(qId){
			const q=getConnectState(qId);
			if(!q)return;
			const box=document.getElementById(qId);
			const feedback=box?box.querySelector('.sgml-feedback'):null;
			box&&box.querySelectorAll('.sgml-connect-item').forEach(el=>el.classList.remove('flash-wrong'));
			const expected=new Set(q.answers.map(pair=>`${pair.left}:${pair.right}`));
			const actual=new Set(q.connections.map(pair=>`${pair[0]}:${pair[1]}`));

			if(actual.size<expected.size||q.connections.length<q.left.length){
				if(feedback){feedback.className='sgml-feedback incorrect';feedback.textContent='Connect all items first.';}
				return;
			}

			let correct=0;
			for(const key of actual){if(expected.has(key))correct++;}
			const allCorrect=correct===expected.size&&actual.size===expected.size;
			if(!allCorrect){
				for(const [left,right] of q.connections){
					if(!expected.has(`${left}:${right}`))flashWrongConnectPair(qId,left,right);
				}
			}
			if(feedback){
				feedback.className='sgml-feedback '+(allCorrect?'correct':'incorrect');
				feedback.textContent=allCorrect?'Correct!':'Incorrect!';
			}
		}

		function resetConnect(qId){
			const q=getConnectState(qId);
			const old=document.getElementById(qId);
			if(!q||!old)return;
			const wrapper=document.createElement('div');
			wrapper.innerHTML=buildConnectHTML({
				id:qId,
				questionRaw:q.questionRaw,
				left:q.left,
				right:q.right,
				answers:q.answers,
				attrs:q.attrs
			});
			const replacement=wrapper.firstElementChild;
			if(!replacement)return;
			old.replaceWith(replacement);
			setupConnectComponents();
			requestAnimationFrame(()=>drawConnectLines(qId));
		}

		function buildConnectHTML(q){
			const attrs=q.attrs||{};
			const displayLeft=attrs.shuffle===true?shuffleArrayCopy(q.left):q.left.slice();
			const displayRight=attrs.shuffle===true?shuffleArrayCopy(q.right):q.right.slice();
			parsedQuestions[q.id]={
				type:'connect',
				questionRaw:q.questionRaw,
				left:q.left,
				right:q.right,
				answers:q.answers,
				attrs,
				displayLeft,
				displayRight,
				connections:[],
				selectedLeft:null,
				selectedRight:null
			};

			const leftHTML=displayLeft.map(item=>`<div class="sgml-connect-item left" data-idx="${item.index}"><span class="idx">${item.index}</span><span>${renderQuestionText(item.text)}</span></div>`).join('');
			const rightHTML=displayRight.map(item=>`<div class="sgml-connect-item right" data-idx="${item.index}"><span class="idx">${item.index}</span><span>${renderQuestionText(item.text)}</span></div>`).join('');

			return`\
				<div class="sgml-qblock sgml-connect" id="${q.id}">\
					<div class="sgml-qtitle">${renderQuestionText(q.questionRaw)}</div>\
					<div class="sgml-connect-board">\
						<svg class="sgml-connect-lines" aria-hidden="true"></svg>\
						<div class="sgml-connect-column">\
							<div class="sgml-connect-heading">Column 1</div>\
							${leftHTML}\
						</div>\
						<div class="sgml-connect-column">\
							<div class="sgml-connect-heading">Column 2</div>\
							${rightHTML}\
						</div>\
					</div>\
					<div class="sgml-connect-status">0 connections made.</div>\
					<div class="sgml-controls">\
						<button type="button" onclick="checkConnectAnswer('${q.id}')">Check Answer</button>\
						<button type="button" onclick="resetConnect('${q.id}')">Reset</button>\
						<span class="sgml-feedback" id="fb_${q.id}"></span>\
					</div>\
				</div>`;
		}

		function setupConnectComponents(){
			document.querySelectorAll('.sgml-connect').forEach(box=>{
				const qId=box.id;
				box.querySelectorAll('.sgml-connect-item.left').forEach(item=>{
					if(item.dataset.bound==='true')return;
					item.dataset.bound='true';
					item.addEventListener('click',()=>toggleConnectLeft(qId,Number(item.dataset.idx)));
				});
				box.querySelectorAll('.sgml-connect-item.right').forEach(item=>{
					if(item.dataset.bound==='true')return;
					item.dataset.bound='true';
					item.addEventListener('click',()=>toggleConnectRight(qId,Number(item.dataset.idx)));
				});
				requestAnimationFrame(()=>drawConnectLines(qId));
			});
			if(!window.__sgmlConnectResizeBound){
				window.__sgmlConnectResizeBound=true;
				window.addEventListener('resize',()=>{
					document.querySelectorAll('.sgml-connect').forEach(box=>drawConnectLines(box.id));
				});
			}
		}

		function parseFlashcardListIntegrated(raw){
			const text=String(raw||'').trim();
			if(!text)return[];

			// Supports: [a,b,c], [a][b][c], and [[a][b][c]].
			if(text[0]==='['){
				const outer=extractBalanced(text,0,'[',']');
				if(outer&&outer.nextIdx===text.length){
					const inner=outer.content.trim();
					const grouped=parseNestedBracketItems(inner);
					if(grouped)return grouped;
					return splitByChar(inner,',').map(decodeInteractiveValue);
				}

				const grouped=parseNestedBracketItems(text);
				if(grouped)return grouped;
			}

			return splitByChar(text,',').map(decodeInteractiveValue);
		}

		function parseFlashcardAnswersIntegrated(raw){
			return parseFlashcardListIntegrated(raw);
		}

		function parseFlashcardQuestionsIntegrated(raw){
			return parseFlashcardListIntegrated(raw);
		}

		function parseFlashcardAt(text,startIndex){
			const source=String(text||'');
			const head=source.slice(startIndex).match(/^<flashcard\s*:?\s*/i);
			if(!head)return null;
			let cur=startIndex+head[0].length;
			while(/\s/.test(source[cur]||''))cur++;
			if(source[cur]!=='(')throw new Error('Flashcard is missing title (...).');
			const title=extractBalanced(source,cur,'(',')');
			if(!title)throw new Error('Unclosed Flashcard title.');
			cur=title.nextIdx;
			while(/\s/.test(source[cur]||''))cur++;
			if(source[cur]!=='[')throw new Error('Flashcard is missing questions [...].');
			const questions=extractBalanced(source,cur,'[',']');
			if(!questions)throw new Error('Unclosed Flashcard questions.');
			cur=questions.nextIdx;
			while(/\s/.test(source[cur]||''))cur++;
			if(source[cur]!=='{')throw new Error('Flashcard is missing answers {...}.');
			const body=extractBalanced(source,cur,'{','}');
			if(!body)throw new Error('Unclosed Flashcard answers.');
			cur=body.nextIdx;
			while(/\s/.test(source[cur]||''))cur++;
			if(source[cur]!=='>')throw new Error('Flashcard is missing closing >.');
			cur++;

			const parts=splitByChar(body.content,'|');
			const answersPart=(parts.shift()||'').trim();
			const attrsRaw=parts.join('|').trim();
			const answersText=answersPart.replace(/^answers\s*:\s*/i,'').trim();
			const questionList=parseFlashcardQuestionsIntegrated(questions.content);
			const answerList=parseFlashcardAnswersIntegrated(answersText);
			if(questionList.length!==answerList.length){
				throw new Error(`Flashcard needs the same number of questions and answers (${questionList.length} questions, ${answerList.length} answers).`);
			}

			return{
				end:cur,
				title:decodeInteractiveValue(title.content),
				questions:questionList.map((value,index)=>({text:value,index})),
				answers:answerList.map((value,index)=>({text:value,index})),
				attrs:parseSimpleAttributeMap(attrsRaw)
			};
		}

		function getFlashcardState(qId){
			const q=parsedQuestions[qId];
			return q&&q.type==='flashcard'?q:null;
		}

		function renderFlashcardCurrent(qId){
			const q=getFlashcardState(qId);
			const box=document.getElementById(qId);
			if(!q||!box)return;
			const progress=box.querySelector('.sgml-flashcard-progress');
			const card=box.querySelector('.sgml-flashcard-card');
			const front=box.querySelector('.sgml-flashcard-front');
			const back=box.querySelector('.sgml-flashcard-back');
			const summary=box.querySelector('.sgml-flashcard-summary');
			const controls=box.querySelector('.sgml-flashcard-controls');
			if(!q.deck.length){
				if(progress)progress.textContent='No flashcards.';
				if(card)card.style.display='none';
				if(controls)controls.style.display='none';
				return;
			}
			if(q.position>=q.deck.length){
				if(progress)progress.textContent='Finished.';
				if(card)card.style.display='none';
				if(controls)controls.style.display='none';
				if(summary){
					summary.style.display='block';
					summary.innerHTML=`Finished. <strong>${q.correct}</strong> Correct, <strong>${q.wrong}</strong> Wrong, <strong>${q.skipped}</strong> Skipped.`+
						` <button type="button" onclick="restartFlashcards('${qId}')">Restart</button>`;
				}
				return;
			}
			const pair=q.deck[q.position];
			if(progress)progress.textContent=`Card ${q.position+1} of ${q.deck.length}`;
			if(front)front.innerHTML=renderQuestionText(pair.front);
			if(back)back.innerHTML=renderQuestionText(pair.back);
			if(card){
				card.style.display='flex';
				card.classList.toggle('revealed',q.revealed);
				card.setAttribute('aria-expanded',q.revealed?'true':'false');
			}
			if(summary)summary.style.display='none';
			if(controls)controls.style.display='flex';
		}

		function toggleFlashcard(qId){
			const q=getFlashcardState(qId);
			if(!q||q.position>=q.deck.length)return;
			q.revealed=!q.revealed;
			renderFlashcardCurrent(qId);
		}

		function revealFlashcard(qId){
			const q=getFlashcardState(qId);
			if(!q||q.position>=q.deck.length)return;
			q.revealed=true;
			renderFlashcardCurrent(qId);
		}

		function rateFlashcard(qId,rating){
			const q=getFlashcardState(qId);
			if(!q||q.position>=q.deck.length)return;
			if(rating==='correct')q.correct++;
			else if(rating==='wrong')q.wrong++;
			else if(rating==='skip')q.skipped++;
			q.position++;
			q.revealed=false;
			renderFlashcardCurrent(qId);
		}

		function restartFlashcards(qId){
			const q=getFlashcardState(qId);
			if(!q)return;
			q.position=0;
			q.correct=0;
			q.wrong=0;
			q.skipped=0;
			q.revealed=false;
			if(q.attrs.shuffle===true)q.deck=shuffleArrayCopy(q.baseDeck);
			else q.deck=q.baseDeck.slice();
			renderFlashcardCurrent(qId);
		}

		function buildFlashcardHTML(q){
			const attrs=q.attrs||{};
			const baseDeck=q.questions.map((question,index)=>({front:question.text,back:q.answers[index].text,index}));
			const deck=attrs.shuffle===true?shuffleArrayCopy(baseDeck):baseDeck.slice();
			parsedQuestions[q.id]={
				type:'flashcard',
				title:q.title,
				baseDeck,
				deck,
				attrs,
				position:0,
				correct:0,
				wrong:0,
				skipped:0,
				revealed:false
			};
			const card=deck[0];
			return`\
				<div class="sgml-qblock sgml-flashcard" id="${q.id}">\
					<div class="sgml-flashcard-title">${renderQuestionText(q.title)}</div>\
					<div class="sgml-flashcard-progress">Card 1 of ${deck.length}</div>\
					<div class="sgml-flashcard-card" role="button" tabindex="0" aria-expanded="false" onclick="toggleFlashcard('${q.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleFlashcard('${q.id}');}">\
						<div class="sgml-flashcard-face">\
							<div class="sgml-flashcard-front">${renderQuestionText(card?card.front:'')}</div>\
							<div class="sgml-flashcard-back"><div class="sgml-flashcard-label">Answer</div>${renderQuestionText(card?card.back:'')}</div>\
							<div class="sgml-flashcard-hint">Tap the card to reveal the answer.</div>\
						</div>\
					</div>\
					<div class="sgml-controls sgml-flashcard-controls">\
						<button type="button" onclick="event.stopPropagation();rateFlashcard('${q.id}','correct')">Correct</button>\
						<button type="button" onclick="event.stopPropagation();rateFlashcard('${q.id}','wrong')">Wrong</button>\
						<button type="button" onclick="event.stopPropagation();rateFlashcard('${q.id}','skip')">Skip</button>\
					</div>\
					<div class="sgml-flashcard-summary" style="display:none"></div>\
				</div>`;
		}

		function buildSpoilerHTML(component){
			const id=`sgml-spoiler-${sgmlSpoilerIdCounter++}`;
			let content=renderEmbeddedSGML(component.content||'');

			// A spoiler behaves like an inline element. If the content rendered
			// as one normal Markdown paragraph, remove only that generated
			// paragraph wrapper so text stays in the surrounding line flow.
			content=content.replace(/^\s*<p>([\s\S]*?)<\/p>\s*$/i,'$1');

			return`<span class="sgml-spoiler" id="${id}"><span class="sgml-spoiler-content">${content}</span><span class="sgml-spoiler-overlay" role="button" tabindex="0" aria-label="Reveal spoiler" onclick="revealSpoiler('${id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();revealSpoiler('${id}');}"></span></span>`;
		}

		function revealSpoiler(id){
			const wrap=document.getElementById(id);
			if(!wrap)return;
			wrap.classList.add('sgml-spoiler-revealed');
			const overlay=wrap.querySelector('.sgml-spoiler-overlay');
			if(overlay)overlay.remove();
		}

		}

		function buildFillinHTML(q){
			const qHTML=renderQuestionText(q.questionRaw);
			const answersList=splitByChar(q.answersRaw,',');
			const parsed=parsePropsAndAnswers(q.correctAndPropsRaw,answersList);

			parsedQuestions[q.id]={

			return`

		function buildEnumerationHTML(q){
			const qHTML=renderQuestionText(q.questionRaw);
			const answersList=splitByChar(q.answersRaw,',');
			const parsed=parsePropsAndAnswers(q.correctAndPropsRaw,answersList);

			if(parsed.props.type==='order'){
				const items=answersList.length?answersList:parsed.correctAnswers;

				parsedQuestions[q.id]={
					type:'enum_order',
					correctAnswers:parsed.correctAnswers,
					props:parsed.props
				};

				let listItemsHTML='';

				items.forEach(item=>{
					listItemsHTML+=`
						<li class="sgml-order-item" draggable="true" data-raw="${encodeURIComponent(item)}">
							<span>${renderQuestionText(item)}</span>
							<div class="sgml-item-actions">
								<button type="button" onclick="moveOrderItem('${q.id}',this,-1)">▲</button>
								<button type="button" onclick="moveOrderItem('${q.id}',this,1)">▼</button>
							</div>
						</li>`;
				});

				return`
					<div class="sgml-qblock" id="${q.id}">
						<div class="sgml-qtitle">${qHTML}</div>
						<ul class="sgml-order-list" id="order_list_${q.id}">${listItemsHTML}</ul>
						<div class="sgml-controls">
							<button onclick="checkEnumOrderAnswer('${q.id}')">Check Order</button>
							<span class="sgml-feedback" id="fb_${q.id}"></span>
						</div>
					</div>`;
			}

			const count=parsed.props.count||parsed.correctAnswers.length||1;

			parsedQuestions[q.id]={
				type:'enum_written',
				count,
				correctAnswers:parsed.correctAnswers,
				props:parsed.props
			};

			let inputsHTML='';

			for(let i=0;i<count;i++){
				inputsHTML+=`
					<div class="sgml-enum-row">
						<span>${i+1}.</span>
						<input type="text" class="sgml-text-input input_${q.id}" placeholder="Answer ${i+1}" autocomplete="off">
					</div>`;
			}

			return`
				<div class="sgml-qblock" id="${q.id}">
					<div class="sgml-qtitle">${qHTML}</div>
					<div class="sgml-inputs">${inputsHTML}</div>
					<div class="sgml-controls">
						<button onclick="checkEnumWrittenAnswer('${q.id}')">Check Answers</button>
						<span class="sgml-feedback" id="fb_${q.id}"></span>
					</div>
				</div>`;
		}

		function normalizeComponentSource(source){
			let text=String(source||'').replace(/\r\n?/g,'\n');
			const lines=text.split('\n');
			while(lines.length&&lines[0].trim()==='')lines.shift();
			while(lines.length&&lines[lines.length-1].trim()==='')lines.pop();
			const indents=lines
				.filter(line=>line.trim())
				.map(line=>{
					const match=line.match(/^[ 	]*/);
					return match?match[0].replace(/	/g,'    ').length:0;
				});
			const minIndent=indents.length?Math.min(...indents):0;
			if(!minIndent)return lines.join('\n');
			return lines.map(line=>{
				let spaces=0;
				let i=0;
				while(i<line.length&&spaces<minIndent){
					if(line[i]==='	')spaces+=4;
					else if(line[i]===' ')spaces++;
					else break;
					i++;
				}
				return line.slice(i);
			}).join('\n');
		}

		window.__sgmlInfoStore={};
		let sgmlInfoIdCounter=0;

		function getInfoStore(){
			if(!window.__sgmlInfoStore)window.__sgmlInfoStore={};
			return window.__sgmlInfoStore;
		}

		function parseComponentAttributes(tag){
			const attrs={};
			if(!tag)return attrs;

			const names=['title','bg','col'];

			names.forEach(name=>{
				const quoted=tag.match(
					new RegExp(`${name}\\s*:\\s*"([^"]*)"`,'i')
				);

				if(quoted){
					attrs[name]=quoted[1];
					return;
				}

				const single=tag.match(
					new RegExp(`${name}\\s*:\\s*'([^']*)'`,'i')
				);

				if(single){
					attrs[name]=single[1];
					return;
				}

				const plain=tag.match(
					new RegExp(`${name}\\s*:\\s*([^\\s>]*)`,'i')
				);

				if(plain)attrs[name]=plain[1];
			});

			return attrs;
		}

		function buildInfoHTML(component,allowNested=true){
			const id=`sgml-info-${sgmlInfoIdCounter++}`;
			const attrs=parseComponentAttributes(component.open||'');
			const title=attrs.title||'Information';
			const bg=attrs.bg||'';
			const col=attrs.col||'';
			const rendered=renderEmbeddedSGML(
				component.content||'',
				{
					allowInfo:allowNested,
					allowRoot:true,
					allowLine:true
				}
			);

			getInfoStore()[id]={
				content:rendered,
				title,
				bg,
				col
			};

			return`
				<span class="sgml-info-wrap" data-info-id="${escapeHTMLAttribute(id)}">
					<button
						type="button"
						class="sgml-info-trigger"
						aria-label="${escapeHTMLAttribute(title)}"
						aria-expanded="false"

		}

		function closeInfoPanel(){
			if(!openInfoWrap)return;

			const button=openInfoWrap.querySelector('.sgml-info-trigger');
			const panel=openInfoWrap._sgmlInfoPanel;

			if(panel&&panel.parentNode)panel.parentNode.removeChild(panel);
			if(button)button.setAttribute('aria-expanded','false');

			openInfoWrap=null;
		}

		function positionInfoPanel(wrap,panel){
			const rect=wrap.getBoundingClientRect();
			const scrollX=window.scrollX||window.pageXOffset||0;
			const scrollY=window.scrollY||window.pageYOffset||0;
			const margin=8;
			const viewportWidth=window.innerWidth;
			const viewportHeight=window.innerHeight;
			const width=Math.min(340,Math.max(200,viewportWidth-20));

			panel.style.width=`${width}px`;
			panel.style.left=`${rect.left+scrollX}px`;
			panel.style.top=`${rect.bottom+scrollY+8}px`;

			requestAnimationFrame(()=>{
				const panelRect=panel.getBoundingClientRect();
				let left=rect.left+scrollX;
				let top=rect.bottom+scrollY+8;

				if(panelRect.right>viewportWidth-margin){
					left-=panelRect.right-(viewportWidth-margin);
				}

				if(left<margin)left=margin;

				if(panelRect.bottom>viewportHeight-margin&&rect.top>panelRect.height+margin){
					top=rect.top+scrollY-panelRect.height-8;
				}

				panel.style.left=`${left}px`;
				panel.style.top=`${top}px`;

				const arrowLeft=Math.max(
					8,
					Math.min(
						panelRect.width-20,
						rect.left+rect.width/2-left-4
					)
				);

				panel.style.setProperty('--sgml-info-arrow-left',`${arrowLeft}px`);
			});
		}

		function toggleInfoPanel(button){
			const wrap=button.closest('.sgml-info-wrap');
			if(!wrap)return;

			if(openInfoWrap===wrap){
				closeInfoPanel();

			closeInfoPanel();

			const id=wrap.dataset.infoId;
			const stored=getInfoStore()[id];
			if(stored===undefined)return;

			const panel=document.createElement('div');
			panel.className='sgml-info-panel';
			panel.setAttribute('role','dialog');
			panel.setAttribute('aria-label',stored.title||'Information');

			if(stored.bg){

			if(stored.col){
				panel.style.setProperty('--sgml-info-col',stored.col);
			}

			const header=document.createElement('div');
			header.className='sgml-info-header';
			header.textContent=stored.title||'Information';

			const body=document.createElement('div');
			body.className='sgml-info-body';
			body.innerHTML=stored.content||'';

			panel.appendChild(header);
			panel.appendChild(body);
			document.body.appendChild(panel);

			wrap._sgmlInfoPanel=panel;
			button.setAttribute('aria-expanded','true');
			openInfoWrap=wrap;

			positionInfoPanel(wrap,panel);

			if(window.MathJax&&window.MathJax.typesetPromise){
				window.MathJax.typesetClear&&window.MathJax.typesetClear([panel]);
				window.MathJax.typesetPromise([panel]).catch(error=>{

				});
			}
		}
