<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8"/>
		<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
		<title>SGML Viewer</title>
		<style>
			:root {
				--bg-color:#ffffff;
				--text-color:#111111;
				--border-color:#cccccc;
				--correct-color:#15803d;
				--incorrect-color:#b91c1c;
				--modal-overlay:rgba(0, 0, 0, 0.48);
			}
			* {
				box-sizing:border-box;
				margin:0;
				padding:0;
			}
			::selection {
			    background: #fff176;
			    color: #000;
			}
			html, body {
				min-height:100%;
			}
			body {
				font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
				color:var(--text-color);
				background-color:var(--bg-color);
				line-height:1.6;
				padding:16px;
				max-width:760px;
				margin:0 auto;
			}
			.sgml-toolbar {
				border-bottom:1px solid var(--border-color);
				padding-bottom:10px;
				margin-bottom:20px;
				display:flex;
				gap:8px;
				flex-wrap:nowrap;
				align-items:center;
				overflow-x:auto;
				overflow-y:hidden;
				white-space:nowrap;
				-webkit-overflow-scrolling:touch;
				scrollbar-width:thin;
			}
			.sgml-toolbar::-webkit-scrollbar {
				height:5px;
			}
			.sgml-toolbar>* {
				flex:0 0 auto;
			}
			button, .btn {
				font-family:inherit;
				font-size:14px;
				padding:6px 12px;
				background:#ffffff;
				border:1px solid #777777;
				border-radius:3px;
				cursor:pointer;
				touch-action:manipulation;
			}
			button:active {
				background:#eeeeee;
			}
			.btn-submit {
				font-weight:bold;
				background:#f0f0f0;
			}
			#editor-drawer {
				display:none;
				width:100%;
				margin-top:10px;
				white-space:normal;
			}
			#editor-drawer.open {
				display:block;
			}
			textarea#sgml-input {
				width:100%;
				height:220px;
				font-family:monospace;
				font-size:13px;
				padding:8px;
				border:1px solid var(--border-color);
				border-radius:3px;
				resize:vertical;
				white-space:pre;
				display:block;
			}
			#sgml-output {
				width:100%;
				word-wrap:break-word;
			}
			#sgml-output h1, #sgml-output h2, #sgml-output h3, #sgml-output h4, #sgml-output h5, #sgml-output h6 {
				margin-top:1.2em;
				margin-bottom:0.4em;
				font-weight:600;
			}
			#sgml-output h1 {
				font-size:1.75em;
				border-bottom:1px solid #eee;
				padding-bottom:0.2em;
			}
			#sgml-output h2 {
				font-size:1.35em;
				border-bottom:1px solid #eee;
				padding-bottom:0.2em;
			}
			#sgml-output h3 {
				font-size:1.15em;
			}
			#sgml-output p {
				margin-bottom:1em;
			}
			#sgml-output ul, #sgml-output ol {
				margin-bottom:1em;
				padding-left:1.5em;
			}
			#sgml-output hr {
				border:0;
				border-top:1px solid var(--border-color);
				margin:1.2em 0;
			}
			#sgml-output blockquote {
				border-left:3px solid #ccc;
				padding-left:0.8em;
				color:#555;
				margin-bottom:1em;
			}
			#sgml-output code {
				font-family:monospace;
				background:#f4f4f4;
				padding:2px 4px;
				border-radius:3px;
			}
			.sgml-qblock {
				border:1px solid var(--border-color);
				padding:12px;
				margin:16px 0;
				border-radius:3px;
			}
			.sgml-qtitle {
				font-weight:600;
				margin-bottom:10px;
			}
			.sgml-options, .sgml-inputs {
				display:flex;
				flex-direction:column;
				gap:6px;
				margin-bottom:10px;
			}
			.sgml-option {
				display:flex;
				align-items:center;
				gap:8px;
				cursor:pointer;
			}
			.sgml-option input[type="radio"] {
				width:16px;
				height:16px;
			}
			input[type="text"].sgml-text-input {
				width:100%;
				max-width:380px;
				padding:5px 8px;
				font-size:14px;
				border:1px solid var(--border-color);
				border-radius:3px;
				font-family:inherit;
			}
			.sgml-controls {
				display:flex;
				align-items:center;
				gap:10px;
				margin-top:6px;
			}
			.sgml-feedback {
				font-size:14px;
				font-weight:bold;
			}
			.sgml-feedback.correct {
				color:var(--correct-color);
			}
			.sgml-feedback.incorrect {
				color:var(--incorrect-color);
			}
			.sgml-order-list {
				list-style:none;
				padding:0;
				margin-bottom:10px;
				display:flex;
				flex-direction:column;
				gap:6px;
			}
			.sgml-order-item {
				display:flex;
				align-items:center;
				justify-content:space-between;
				padding:6px 10px;
				border:1px solid var(--border-color);
				border-radius:3px;
				background:#fff;
				cursor:grab;
				gap:8px;
			}
			.sgml-order-item.dragging {
				opacity:0.4;
			}
			.sgml-item-actions {
				display:flex;
				gap:4px;
				flex:0 0 auto;
			}
			.sgml-item-actions button {
				padding:2px 6px;
				font-size:12px;
			}
			.sgml-enum-row {
				display:flex;
				align-items:center;
				gap:8px;
			}
			.sgml-modal-backdrop {
				position:fixed;
				inset:0;
				background:var(--modal-overlay);
				display:none;
				align-items:center;
				justify-content:center;
				padding:16px;
				z-index:9999;
			}
			.sgml-modal-backdrop.open {
				display:flex;
			}
			.sgml-modal-backdrop.confirm-layer {
				z-index:10001;
			}
			.sgml-modal {
				width:min(100%, 520px);
				max-height:min(90vh, 720px);
				background:#ffffff;
				border:1px solid #888888;
				border-radius:5px;
				box-shadow:0 12px 35px rgba(0, 0, 0, .22);
				overflow:hidden;
				display:flex;
				flex-direction:column;
			}
			.sgml-modal-header {
				padding:12px 14px;
				border-bottom:1px solid var(--border-color);
				font-weight:700;
				flex:0 0 auto;
			}
			.sgml-modal-body {
				padding:14px;
				overflow-y:auto;
				-webkit-overflow-scrolling:touch;
			}
			.sgml-modal-footer {
				padding:10px 14px;
				border-top:1px solid var(--border-color);
				display:flex;
				justify-content:flex-end;
				gap:8px;
				flex:0 0 auto;
			}
			.sgml-modal-message {
				white-space:pre-wrap;
				word-break:break-word;
			}
			.sgml-library-list {
				display:flex;
				flex-direction:column;
				gap:8px;
				max-height:60vh;
				overflow-y:auto;
				-webkit-overflow-scrolling:touch;
			}
			.sgml-library-item {
				width:100%;
				border:1px solid var(--border-color);
				border-radius:4px;
				background:#fff;
				padding:10px;
				text-align:left;
				display:flex;
				align-items:center;
				gap:8px;
			}
			.sgml-library-load {
				min-width:0;
				flex:1;
				border:0;
				background:transparent;
				padding:0;
				text-align:left;
			}
			.sgml-library-item-title {
				font-weight:700;
				margin-bottom:3px;
				overflow:hidden;
				text-overflow:ellipsis;
				white-space:nowrap;
			}
			.sgml-library-item-preview {
				color:#555;
				font-family:monospace;
				font-size:12px;
				overflow:hidden;
				text-overflow:ellipsis;
				white-space:nowrap;
			}
			.sgml-library-delete {
				flex:0 0 auto;
				width:32px;
				height:32px;
				padding:0;
				border:0;
				border-radius:4px;
				background:#dc2626;
				color:#fff;
				font-size:20px;
				font-weight:700;
				line-height:32px;
				text-align:center;
			}
			.sgml-library-delete:active {
				background:#b91c1c;
			}
			.sgml-library-empty {
				color:#666;
				padding:10px 0;
			}
			.sgml-current-name {
				margin-top:7px;
				font-size:12px;
				color:#666;
				white-space:nowrap;
				overflow:hidden;
				text-overflow:ellipsis;
			}
		</style>
	</head>
	<body>
		<div class="sgml-toolbar">
			<button onclick="createNewSGML()">New SGML</button>
			<button onclick="openLibrary()">Load SGML</button>
			<button onclick="document.getElementById('file-upload-input').click()">Upload File</button>
			<button onclick="downloadSGML()">Download SGML</button>
			<button onclick="toggleEditor()">Edit Code</button>
			<button class="btn-submit" onclick="checkAllQuestions()">Check All Answers</button>
			<button id="offline-button" onclick="handleOfflineButton()">Enable Offline</button>
			<button onclick="window.open('https://gemini.google.com/gem/1TCc5lmYcFHr5piZ27QsNzA04Mvv49YiO','_blank')">SAIG</button>
			<input accept=".sgml,.txt,.md" id="file-upload-input" onchange="handleFileUpload(event)" style="display:none;" type="file"/>
		</div>

		<div class="sgml-current-name" id="sgml-current-name"></div>

		<div id="editor-drawer">
			<textarea id="sgml-input" placeholder="Paste SGML content here..."></textarea>
			<div style="margin-top:8px;display:flex;gap:8px;">
				<button class="btn-submit" onclick="loadSGMLFromEditor()">Render SGML</button>
				<button onclick="loadDefaultSample()">Load Sample</button>
			</div>
		</div>

		<main id="sgml-output"></main>

		<div aria-hidden="true" class="sgml-modal-backdrop confirm-layer" id="confirm-modal">
			<div aria-labelledby="confirm-title" aria-modal="true" class="sgml-modal" role="dialog">
				<div class="sgml-modal-header" id="confirm-title">Confirm</div>
				<div class="sgml-modal-body">
					<div class="sgml-modal-message" id="confirm-message"></div>
				</div>
				<div class="sgml-modal-footer">
					<button id="confirm-cancel">Cancel</button>
					<button class="btn-submit" id="confirm-ok">Confirm</button>
				</div>
			</div>
		</div>

		<div aria-hidden="true" class="sgml-modal-backdrop" id="library-modal">
			<div aria-labelledby="library-title" aria-modal="true" class="sgml-modal" role="dialog">
				<div class="sgml-modal-header" id="library-title">Saved SGML</div>
				<div class="sgml-modal-body">
					<div class="sgml-library-list" id="library-list"></div>
				</div>
				<div class="sgml-modal-footer">
					<button onclick="closeLibrary()">Close</button>
				</div>
			</div>
		</div>

		<script src="./marked.js"></script>
		<script>
			let parsedQuestions={};
			const STORAGE_DOCS='sgml_viewer_documents';
			const STORAGE_CURRENT_ID='sgml_viewer_current_id';
			const STORAGE_CURRENT_CONTENT='sgml_viewer_current_sgml';
			const STORAGE_DEFAULT_MADE='sgml_viewer_default_created';
			let currentDocumentId=null;

			function makeId(){
				return 'sgml_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);
			}

			function loadDocuments(){
				try{
					const raw=localStorage.getItem(STORAGE_DOCS);
					if(!raw)return[];
					const docs=JSON.parse(raw);
					return Array.isArray(docs)?docs:[];
				}catch(error){
					console.error('Could not load SGML library:',error);
					return[];
				}
			}

			function saveDocuments(docs){
				localStorage.setItem(STORAGE_DOCS,JSON.stringify(docs));
			}

			function getCurrentDocument(){
				const docs=loadDocuments();
				return docs.find(doc=>doc.id===currentDocumentId)||null;
			}

			function setCurrentDocumentId(id){
				currentDocumentId=id;
				localStorage.setItem(STORAGE_CURRENT_ID,id);
			}

			function saveCurrentSGML(nameOverride=null){
				const input=document.getElementById('sgml-input');
				const content=input?input.value:'';
				let docs=loadDocuments();
				let doc=docs.find(item=>item.id===currentDocumentId);

				if(!doc){
					doc={
						id:makeId(),
						title:nameOverride||'Untitled SGML',
						content:'',
						createdAt:Date.now(),
						updatedAt:Date.now()
					};
					docs.push(doc);
					setCurrentDocumentId(doc.id);
				}

				if(nameOverride!==null)doc.title=nameOverride;
				doc.content=content;
				doc.updatedAt=Date.now();
				saveDocuments(docs);
				localStorage.setItem(STORAGE_CURRENT_CONTENT,content);
				updateCurrentName(doc);
			}

			function loadDocumentIntoEditor(doc){
				if(!doc)return;
				setCurrentDocumentId(doc.id);
				document.getElementById('sgml-input').value=doc.content||'';
				localStorage.setItem(STORAGE_CURRENT_CONTENT,doc.content||'');
				updateCurrentName(doc);
				renderSGML(doc.content||'');
			}

			function updateCurrentName(doc=getCurrentDocument()){
				const el=document.getElementById('sgml-current-name');
				if(!el)return;
				el.textContent=doc?`Current SGML: ${doc.title}`:'';
				el.title=doc?doc.title:'';
			}

			function setupAutosave(){
				const input=document.getElementById('sgml-input');
				input.addEventListener('input',()=>{
					saveCurrentSGML();
				});
			}

			function confirmDialog(message,title='Confirm',confirmText='Confirm'){
				return new Promise(resolve=>{
					const backdrop=document.getElementById('confirm-modal');
					const titleEl=document.getElementById('confirm-title');
					const messageEl=document.getElementById('confirm-message');
					const okBtn=document.getElementById('confirm-ok');
					const cancelBtn=document.getElementById('confirm-cancel');

					titleEl.textContent=title;
					messageEl.textContent=message;
					okBtn.textContent=confirmText;
					backdrop.classList.add('open');
					backdrop.setAttribute('aria-hidden','false');

					let finished=false;

					const finish=value=>{
						if(finished)return;
						finished=true;
						backdrop.classList.remove('open');
						backdrop.setAttribute('aria-hidden','true');
						okBtn.removeEventListener('click',onOk);
						cancelBtn.removeEventListener('click',onCancel);
						backdrop.removeEventListener('click',onBackdrop);
						document.removeEventListener('keydown',onKeyDown);
						resolve(value);
					};

					const onOk=()=>finish(true);
					const onCancel=()=>finish(false);
					const onBackdrop=event=>{
						if(event.target===backdrop)finish(false);
					};
					const onKeyDown=event=>{
						if(event.key==='Escape')finish(false);
					};

					okBtn.addEventListener('click',onOk);
					cancelBtn.addEventListener('click',onCancel);
					backdrop.addEventListener('click',onBackdrop);
					document.addEventListener('keydown',onKeyDown);
				});
			}

			async function getServiceWorkerRegistration(){
				if(!('serviceWorker'in navigator))return null;
				try{
					return await navigator.serviceWorker.getRegistration('./');
				}catch(error){
					console.error(error);
					return null;
				}
			}

			function waitForController(timeout=5000){
				if(navigator.serviceWorker.controller)return Promise.resolve();

				return new Promise(resolve=>{
					let done=false;

					const finish=()=>{
						if(done)return;
						done=true;
						navigator.serviceWorker.removeEventListener('controllerchange',finish);
						clearTimeout(timer);
						resolve();
					};

					const timer=setTimeout(finish,timeout);
					navigator.serviceWorker.addEventListener('controllerchange',finish);
				});
			}

			async function cacheCurrentPageWithServiceWorker(registration){
				await waitForController();

				const worker=navigator.serviceWorker.controller||registration.active||registration.waiting||registration.installing;
				if(!worker)throw new Error('Service Worker is not active yet.');

				await new Promise((resolve,reject)=>{
					const channel=new MessageChannel();
					const timeout=setTimeout(()=>reject(new Error('Offline cache request timed out.')),10000);

					channel.port1.onmessage=event=>{
						clearTimeout(timeout);
						if(event.data&&event.data.ok)resolve();
						else reject(new Error(event.data&&event.data.error?event.data.error:'Offline cache failed.'));
					};

					worker.postMessage({
						type:'CACHE_URL',
						url:location.href
					},[channel.port2]);
				});
			}

			async function enableOffline(){
				if(!('serviceWorker'in navigator)){
					await confirmDialog(
						'This browser/WebView does not support Service Workers, so Offline mode cannot be enabled here.',
						'Offline unavailable',
						'OK'
					);
					return;
				}

				try{
					const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
					await registration.update();

					if(registration.waiting){
						registration.waiting.postMessage({type:'SKIP_WAITING'});
					}

					await waitForController(6000);
					await cacheCurrentPageWithServiceWorker(registration);
					updateOfflineButton(true);

					await confirmDialog(
						'Offline mode is enabled. This browser page can now be opened from its offline cache.',
						'Offline enabled',
						'OK'
					);
				}catch(error){
					console.error('Offline setup failed:',error);

					await confirmDialog(
						'Offline mode could not be enabled. Make sure this page is being served from HTTP(S) and that sw.js is in the same folder.',
						'Offline setup failed',
						'OK'
					);
				}
			}

			async function disableOfflineAndRefresh(){
				const confirmed=await confirmDialog(
					'This will update to the most recent browser page and remove this page from its offline cache.\n\nAfter this, it cannot be accessed offline anymore unless you enable Offline again.',
					'Refresh browser?',
					'Refresh'
				);

				if(!confirmed)return;

				try{
					const registration=await getServiceWorkerRegistration();

					if(registration){
						try{
							await new Promise(resolve=>{
								const worker=navigator.serviceWorker.controller||registration.active;

								if(!worker){
									resolve();
									return;
								}

								const channel=new MessageChannel();
								let finished=false;

								const finish=()=>{
									if(finished)return;
									finished=true;
									clearTimeout(timeout);
									resolve();
								};

								const timeout=setTimeout(finish,3000);
								channel.port1.onmessage=finish;

								worker.postMessage({type:'DISABLE_OFFLINE'},[channel.port2]);
							});
						}catch(error){
							console.warn('Could not ask worker to clear cache:',error);
						}

						await registration.unregister();
					}

					if('caches'in window){
						const keys=await caches.keys();

						await Promise.all(
							keys
								.filter(key=>key.startsWith('sgml-viewer-offline-'))
								.map(key=>caches.delete(key))
						);
					}

					updateOfflineButton(false);

					const url=new URL(location.href);
					url.searchParams.set('__sgml_refresh',String(Date.now()));
					location.replace(url.href);
				}catch(error){
					console.error('Refresh cleanup failed:',error);

					const url=new URL(location.href);
					url.searchParams.set('__sgml_refresh',String(Date.now()));
					location.replace(url.href);
				}
			}

			async function handleOfflineButton(){
				const button=document.getElementById('offline-button');

				if(button.dataset.mode==='refresh'){
					await disableOfflineAndRefresh();
				}else{
					await enableOffline();
				}
			}

			function updateOfflineButton(enabled){
				const button=document.getElementById('offline-button');
				button.textContent=enabled?'Refresh':'Enable Offline';
				button.dataset.mode=enabled?'refresh':'enable';
			}

			async function updateOfflineButtonFromState(){
				if(!('serviceWorker'in navigator)){
					updateOfflineButton(false);
					return;
				}

				const registration=await getServiceWorkerRegistration();
				updateOfflineButton(!!registration);
			}

			/*
				SGML renderer/parser escaping

				Backticks are structural string wrappers inside parsed fields.

				Examples:
					[`Washington, D.C.`,Manila,Cebu]
					[`Hello, \`world\``,Apple]

				Supported escapes:
					\,  literal comma
					\|  literal pipe
					\`  literal backtick
					\\  literal backslash

				Other structural characters can also be escaped:
					\[ \] \( \) \{ \} \< \>

				Backslash escaping is handled before delimiter detection.
			*/
			function isSGMLEscapable(char){
				return "\\`,|[](){}<>".includes(char);
			}

			function decodeSGMLEscapes(str){
				if(!str)return'';

				let result='';

				for(let i=0;i<str.length;i++){
					const c=str[i];

					if(c==='\\'&&i+1<str.length&&isSGMLEscapable(str[i+1])){
						result+=str[i+1];
						i++;
						continue;
					}

					result+=c;
				}

				return result;
			}

			function extractTrueText(rawStr){
				if(!rawStr)return'';

				let str=rawStr;

				while(/<st\b[^>]*>/gi.test(str)||/<\/st>/gi.test(str)){
					str=str
						.replace(/<st\b[^>]*>/gi,'')
						.replace(/<\/str>/gi,'')
						.replace(/<\/st>/gi,'');
				}

				str=str.replace(/<\/?[^>]+(>|$)/g,'');
				str=decodeSGMLEscapes(str);
				str=str.replace(/[*_~`#]/g,'');
				return str.trim();
			}

			function splitByChar(str,charToSplit){
				if(!str)return[];

				const result=[];
				let current='';
				let depth=0;
				let inBackticks=false;

				for(let i=0;i<str.length;i++){
					const c=str[i];

					/*
						Escapes are processed before checking backticks
						or delimiters. This prevents:
							\, from splitting
							\| from splitting
							\` from toggling literal mode
							\\ from escaping the next character
					*/
					if(c==='\\'&&i+1<str.length&&isSGMLEscapable(str[i+1])){
						current+=str[i+1];
						i++;
						continue;
					}

					/*
						Backticks wrap a literal value.

						While inside backticks:
							, does not split
							| does not split
							brackets do not affect depth
					*/
					if(c==='`'){
						inBackticks=!inBackticks;
						continue;
					}

					if(!inBackticks){
						if(c==='<'||c==='['||c==='('||c==='{')depth++;
						else if(c==='>'||c===']'||c===')'||c==='}')depth--;

						if(c===charToSplit&&depth===0){
							result.push(current.trim());
							current='';
							continue;
						}
					}

					current+=c;
				}

				if(current.trim())result.push(current.trim());

				return result;
			}

			function extractBalanced(text,startIdx,openChar,closeChar){
				let count=0;
				let content='';
				let inBackticks=false;

				for(let i=startIdx;i<text.length;i++){
					const c=text[i];

					/*
						Escaped structural characters must not affect
						balancing. Keep the original escape sequence here;
						splitByChar will decode it later when appropriate.
					*/
					if(c==='\\'&&i+1<text.length&&isSGMLEscapable(text[i+1])){
						content+=c+text[i+1];
						i++;
						continue;
					}

					if(c==='`'){
						inBackticks=!inBackticks;
						content+=c;
						continue;
					}

					if(inBackticks){
						content+=c;
						continue;
					}

					if(c===openChar){
						count++;

						if(count===1)continue;
					}

					if(c===closeChar){
						count--;

						if(count===0){
							return{
								content,
								nextIdx:i+1
							};
						}
					}

					if(count>0)content+=c;
				}

				return null;
			}

			function parseQuestionBlocks(inputStr){
				const questions=[];
				let i=0;
				let output='';

				while(i<inputStr.length){
					const match=inputStr.slice(i).match(/^<(Choices|Fillin|Enumeration):/i);

					if(match){
						const type=match[1];
						let cur=i+match[0].length;

						while(cur<inputStr.length&&/\s/.test(inputStr[cur]))cur++;

						if(inputStr[cur]==='('){
							const qRes=extractBalanced(inputStr,cur,'(',')');

							if(qRes){
								cur=qRes.nextIdx;

								while(cur<inputStr.length&&/\s/.test(inputStr[cur]))cur++;

								if(inputStr[cur]==='['){
									const aRes=extractBalanced(inputStr,cur,'[',']');

									if(aRes){
										cur=aRes.nextIdx;

										while(cur<inputStr.length&&/\s/.test(inputStr[cur]))cur++;

										if(inputStr[cur]==='{'){
											const cRes=extractBalanced(inputStr,cur,'{','}');

											if(cRes){
												cur=cRes.nextIdx;

												while(cur<inputStr.length&&/\s/.test(inputStr[cur]))cur++;

												if(inputStr[cur]==='>'){
													cur++;

													const qId='sgmlq'+questions.length;

													questions.push({
														id:qId,
														type:type.toLowerCase(),
														questionRaw:qRes.content,
														answersRaw:aRes.content,
														correctAndPropsRaw:cRes.content
													});

													output+=`\n\n%%QBLOCKTOKEN${qId}%%\n\n`;
													i=cur;
													continue;
												}
											}
										}
									}
								}
							}
						}
					}

					output+=inputStr[i];
					i++;
				}

				return{
					processedText:output,
					questions
				};
			}

			function parsePropsAndAnswers(correctAndPropsRaw,answersList){
				const result={
					props:{
						case:false,
						inorder:false,
						count:null,
						type:null
					},
					correctAnswers:[]
				};

				const segments=splitByChar(correctAndPropsRaw,'|');

				segments.forEach(seg=>{
					const propMatch=seg.match(/^([a-zA-Z]+)\s*:\s*(.+)$/);

					if(propMatch){
						const key=propMatch[1].toLowerCase();
						const val=propMatch[2].trim().toLowerCase();

						if(key==='case')result.props.case=(val==='true');
						else if(key==='inorder')result.props.inorder=(val==='true');
						else if(key==='count')result.props.count=parseInt(val,10);
						else if(key==='type')result.props.type=val;
						else if(key==='order'&&val==='true')result.props.type='order';
					}else{
						const idxMatches=[...seg.matchAll(/\[idx:(\d+)\]/gi)];

						if(idxMatches.length>0){
							idxMatches.forEach(m=>{
								const idx=parseInt(m[1],10);

								if(answersList[idx]!==undefined){
									result.correctAnswers.push(answersList[idx]);
								}
							});
						}else if(seg){
							const rawAnswers=splitByChar(seg,',');
							result.correctAnswers.push(...rawAnswers);
						}
					}
				});

				if(result.correctAnswers.length===0&&answersList.length>0){
					result.correctAnswers=[...answersList];
				}

				return result;
			}

			function renderST(str){
				if(!str)return'';

				return str
					.replace(/<st\s+([^>]*?)>/gi,(m,a)=>{
						const rules=[];

						a.trim().split(/\s+/).forEach(p=>{
							const i=p.indexOf(':');

							if(i<0)return;

							let k=p.slice(0,i).trim();
							let v=p.slice(i+1).trim();

							if(k==='col')k='color';
							else if(k==='bg')k='background-color';
							else if(k==='fontSize')k='font-size';
							else if(k==='fontFamily')k='font-family';

							rules.push(`${k}:${v}`);
						});

						return `<span style="${rules.join(';')}">`;
					})
					.replace(/<\/st>/gi,'</span>');
			}

			function renderMarkdown(mdText){
				if(!mdText)return'';
			
				const saved=[];
			
				const source=String(mdText).replace(
					/<st\b[^>]*>|<\/st>/gi,
					tag=>{
						const id=saved.length;
						saved.push(tag);
						return`\uE000SGMLST${id}\uE001`;
					}
				);
			
				let result=marked.parse(source,{
					gfm:true,
					breaks:true
				});
			
				result=result.replace(
					/\uE000SGMLST(\d+)\uE001/g,
					(_,i)=>saved[Number(i)]||''
				);
			
				return renderST(result);
			}

			function buildChoicesHTML(q){
				const qHTML=renderMarkdown(q.questionRaw);
				const options=splitByChar(q.answersRaw,',');
				const parsed=parsePropsAndAnswers(q.correctAndPropsRaw,options);

				parsedQuestions[q.id]={
					type:'choices',
					options:options,
					correctAnswers:parsed.correctAnswers,
					props:parsed.props
				};

				let optionsHTML='';

				options.forEach((opt,idx)=>{
					optionsHTML+=`
						<label class="sgml-option">
							<input type="radio" name="radio_${q.id}" value="${idx}">
							<span>${renderMarkdown(opt)}</span>
						</label>`;
				});

				return `
					<div class="sgml-qblock" id="${q.id}">
						<div class="sgml-qtitle">${qHTML}</div>
						<div class="sgml-options">${optionsHTML}</div>
						<div class="sgml-controls">
							<button onclick="checkChoicesAnswer('${q.id}')">Check Answer</button>
							<span class="sgml-feedback" id="fb_${q.id}"></span>
						</div>
					</div>`;
			}

			function buildFillinHTML(q){
				const qHTML=renderMarkdown(q.questionRaw);
				const answersList=splitByChar(q.answersRaw,',');
				const parsed=parsePropsAndAnswers(q.correctAndPropsRaw,answersList);

				parsedQuestions[q.id]={
					type:'fillin',
					correctAnswers:parsed.correctAnswers,
					props:parsed.props
				};

				return `
					<div class="sgml-qblock" id="${q.id}">
						<div class="sgml-qtitle">${qHTML}</div>
						<div class="sgml-inputs">
							<input type="text" class="sgml-text-input" id="input_${q.id}" placeholder="Type answer..." autocomplete="off">
						</div>
						<div class="sgml-controls">
							<button onclick="checkFillinAnswer('${q.id}')">Check Answer</button>
							<span class="sgml-feedback" id="fb_${q.id}"></span>
						</div>
					</div>`;
			}

			function buildEnumerationHTML(q){
				const qHTML=renderMarkdown(q.questionRaw);
				const answersList=splitByChar(q.answersRaw,',');
				const parsed=parsePropsAndAnswers(q.correctAndPropsRaw,answersList);

				if(parsed.props.type==='order'){
					const items=answersList.length>0?answersList:parsed.correctAnswers;

					parsedQuestions[q.id]={
						type:'enum_order',
						correctAnswers:parsed.correctAnswers,
						props:parsed.props
					};

					let listItemsHTML='';

					items.forEach(item=>{
						listItemsHTML+=`
							<li class="sgml-order-item" draggable="true" data-raw="${encodeURIComponent(item)}">
								<span>${renderMarkdown(item)}</span>
								<div class="sgml-item-actions">
									<button type="button" onclick="moveOrderItem('${q.id}', this, -1)">▲</button>
									<button type="button" onclick="moveOrderItem('${q.id}', this, 1)">▼</button>
								</div>
							</li>`;
					});

					return `
						<div class="sgml-qblock" id="${q.id}">
							<div class="sgml-qtitle">${qHTML}</div>
							<ul class="sgml-order-list" id="order_list_${q.id}">${listItemsHTML}</ul>
							<div class="sgml-controls">
								<button onclick="checkEnumOrderAnswer('${q.id}')">Check Order</button>
								<span class="sgml-feedback" id="fb_${q.id}"></span>
							</div>
						</div>`;
				}else{
					const count=parsed.props.count||parsed.correctAnswers.length||1;

					parsedQuestions[q.id]={
						type:'enum_written',
						count:count,
						correctAnswers:parsed.correctAnswers,
						props:parsed.props
					};

					let inputsHTML='';

					for(let i=0;i<count;i++){
						inputsHTML+=`
							<div class="sgml-enum-row">
								<span>${i+1}.</span>
								<input type="text" class="sgml-text-input input_${q.id}" placeholder="Answer ${i+1}" autocomplete="off">
							</div>`;
					}

					return `
						<div class="sgml-qblock" id="${q.id}">
							<div class="sgml-qtitle">${qHTML}</div>
							<div class="sgml-inputs">${inputsHTML}</div>
							<div class="sgml-controls">
								<button onclick="checkEnumWrittenAnswer('${q.id}')">Check Answers</button>
								<span class="sgml-feedback" id="fb_${q.id}"></span>
							</div>
						</div>`;
				}
			}

			function checkChoicesAnswer(qId){
				const q=parsedQuestions[qId];
				const selected=document.querySelector(`input[name="radio_${qId}"]:checked`);
				const fb=document.getElementById(`fb_${qId}`);

				if(!selected){
					fb.className='sgml-feedback incorrect';
					fb.textContent='Select an option.';
					return;
				}

				const selectedIdx=parseInt(selected.value,10);
				const userSelectedRaw=q.options[selectedIdx];
				const userTrueText=extractTrueText(userSelectedRaw);

				const isCorrect=q.correctAnswers.some(cRaw=>{
					const cTrueText=extractTrueText(cRaw);
					return q.props.case
						?userTrueText===cTrueText
						:userTrueText.toLowerCase()===cTrueText.toLowerCase();
				});

				setFeedback(fb,isCorrect);
			}

			function checkFillinAnswer(qId){
				const q=parsedQuestions[qId];
				const input=document.getElementById(`input_${qId}`);
				const fb=document.getElementById(`fb_${qId}`);
				const userTrueText=extractTrueText(input.value);

				const isCorrect=q.correctAnswers.some(cRaw=>{
					const cTrueText=extractTrueText(cRaw);
					return q.props.case
						?userTrueText===cTrueText
						:userTrueText.toLowerCase()===cTrueText.toLowerCase();
				});

				setFeedback(fb,isCorrect);
			}

			function checkEnumOrderAnswer(qId){
				const q=parsedQuestions[qId];
				const list=document.getElementById(`order_list_${qId}`);
				const fb=document.getElementById(`fb_${qId}`);
				const currentItems=Array.from(list.querySelectorAll('.sgml-order-item'));

				const userTrueList=currentItems.map(li=>extractTrueText(decodeURIComponent(li.dataset.raw)));
				const correctTrueList=q.correctAnswers.map(cRaw=>extractTrueText(cRaw));

				let isCorrect=userTrueList.length===correctTrueList.length;

				if(isCorrect){
					for(let i=0;i<userTrueList.length;i++){
						const u=userTrueList[i];
						const c=correctTrueList[i];
						const match=q.props.case?u===c:u.toLowerCase()===c.toLowerCase();

						if(!match){
							isCorrect=false;
							break;
						}
					}
				}

				setFeedback(fb,isCorrect);
			}

			function checkEnumWrittenAnswer(qId){
				const q=parsedQuestions[qId];
				const inputs=Array.from(document.querySelectorAll(`.input_${qId}`));
				const fb=document.getElementById(`fb_${qId}`);

				const userTrueTexts=inputs.map(inp=>extractTrueText(inp.value)).filter(t=>t.length>0);
				const correctTrueTexts=q.correctAnswers.map(cRaw=>extractTrueText(cRaw));

				let isCorrect=true;

				if(userTrueTexts.length<q.count){
					isCorrect=false;
				}else if(q.props.inorder){
					for(let i=0;i<q.count;i++){
						const u=userTrueTexts[i]||'';
						const c=correctTrueTexts[i]||'';
						const match=q.props.case?u===c:u.toLowerCase()===c.toLowerCase();

						if(!match){
							isCorrect=false;
							break;
						}
					}
				}else{
					const availableCorrect=[...correctTrueTexts];

					for(let u of userTrueTexts){
						const matchIdx=availableCorrect.findIndex(c=>
							q.props.case?u===c:u.toLowerCase()===c.toLowerCase()
						);

						if(matchIdx!==-1){
							availableCorrect.splice(matchIdx,1);
						}else{
							isCorrect=false;
							break;
						}
					}
				}

				setFeedback(fb,isCorrect);
			}

			function setFeedback(element,isCorrect){
				if(isCorrect){
					element.className='sgml-feedback correct';
					element.textContent='Correct!';
				}else{
					element.className='sgml-feedback incorrect';
					element.textContent='Incorrect!';
				}
			}

			function checkAllQuestions(){
				Object.keys(parsedQuestions).forEach(qId=>{
					const q=parsedQuestions[qId];

					if(q.type==='choices')checkChoicesAnswer(qId);
					else if(q.type==='fillin')checkFillinAnswer(qId);
					else if(q.type==='enum_order')checkEnumOrderAnswer(qId);
					else if(q.type==='enum_written')checkEnumWrittenAnswer(qId);
				});
			}

			function moveOrderItem(qId,btn,direction){
				const li=btn.closest('.sgml-order-item');
				const list=document.getElementById(`order_list_${qId}`);

				if(direction===-1&&li.previousElementSibling){
					list.insertBefore(li,li.previousElementSibling);
				}else if(direction===1&&li.nextElementSibling){
					list.insertBefore(li.nextElementSibling,li);
				}
			}

			function setupDragAndDrop(){
				document.querySelectorAll('.sgml-order-list').forEach(list=>{
					let draggedItem=null;

					list.addEventListener('dragstart',e=>{
						draggedItem=e.target.closest('.sgml-order-item');

						if(draggedItem)draggedItem.classList.add('dragging');
					});

					list.addEventListener('dragend',()=>{
						if(draggedItem)draggedItem.classList.remove('dragging');
						draggedItem=null;
					});

					list.addEventListener('dragover',e=>{
						e.preventDefault();

						const draggableElements=[
							...list.querySelectorAll('.sgml-order-item:not(.dragging)')
						];

						const afterElement=draggableElements.reduce((closest,child)=>{
							const box=child.getBoundingClientRect();
							const offset=e.clientY-box.top-box.height/2;

							if(offset<0&&offset>closest.offset){
								return{
									offset,
									element:child
								};
							}

							return closest;
						},{
							offset:Number.NEGATIVE_INFINITY
						}).element;

						if(draggedItem){
							if(afterElement==null)list.appendChild(draggedItem);
							else list.insertBefore(draggedItem,afterElement);
						}
					});
				});
			}

			function renderSGML(sgmlContent){
				parsedQuestions={};

				const{
					processedText,
					questions
				}=parseQuestionBlocks(sgmlContent);

				let renderedDoc=renderMarkdown(processedText);

				questions.forEach(q=>{
					let qHtml='';

					if(q.type==='choices')qHtml=buildChoicesHTML(q);
					else if(q.type==='fillin')qHtml=buildFillinHTML(q);
					else if(q.type==='enumeration')qHtml=buildEnumerationHTML(q);

					renderedDoc=renderedDoc.replace(`%%QBLOCKTOKEN${q.id}%%`,qHtml);
				});

				document.getElementById('sgml-output').innerHTML=renderedDoc;
				setupDragAndDrop();
			}

			function handleFileUpload(event){
				const file=event.target.files[0];
				event.target.value='';

				if(!file)return;

				const reader=new FileReader();

				reader.onload=function(e){
					const content=String(e.target.result||'');
					const current=getCurrentDocument();

					if(!current||!(current.content||'').trim()){
						if(!current){
							const docs=loadDocuments();

							const doc={
								id:makeId(),
								title:'Upload',
								content,
								createdAt:Date.now(),
								updatedAt:Date.now()
							};

							docs.push(doc);
							saveDocuments(docs);
							setCurrentDocumentId(doc.id);
							loadDocumentIntoEditor(doc);
						}else{
							current.title='Upload';
							current.content=content;
							current.updatedAt=Date.now();

							const docs=loadDocuments().map(doc=>
								doc.id===current.id?current:doc
							);

							saveDocuments(docs);
							localStorage.setItem(STORAGE_CURRENT_CONTENT,content);
							document.getElementById('sgml-input').value=content;
							updateCurrentName(current);
							renderSGML(content);
						}
					}else{
						const docs=loadDocuments();
						const baseName=file.name.replace(/\.[^.]+$/,'')||'Upload';

						const doc={
							id:makeId(),
							title:baseName,
							content,
							createdAt:Date.now(),
							updatedAt:Date.now()
						};

						docs.push(doc);
						saveDocuments(docs);
						loadDocumentIntoEditor(doc);
					}
				};

				reader.readAsText(file);
			}

			function downloadSGML(){
				const doc=getCurrentDocument();
				const content=String(document.getElementById('sgml-input').value||'');
				const base=String(doc&&doc.title||'Untitled SGML')
					.replace(/\.[^.]+$/,'')
					.replace(/[\\/:*?"<>|]+/g,'_')
					.trim()||'Untitled SGML';

				const blob=new Blob([content],{
					type:'text/plain;charset=utf-8'
				});

				const url=URL.createObjectURL(blob);
				const a=document.createElement('a');

				a.href=url;
				a.download=base+'.sgml';
				a.setAttribute('download',base+'.sgml');

				document.body.appendChild(a);
				a.click();
				a.remove();

				setTimeout(()=>URL.revokeObjectURL(url),1000);
			}

			function toggleEditor(){
				const drawer=document.getElementById('editor-drawer');
				drawer.classList.toggle('open');
			}

			function loadSGMLFromEditor(){
				const code=document.getElementById('sgml-input').value;
				saveCurrentSGML();
				renderSGML(code);
				document.getElementById('editor-drawer').classList.remove('open');
			}

			async function createNewSGML(){
				const docs=loadDocuments();

				const doc={
					id:makeId(),
					title:'Untitled SGML',
					content:'',
					createdAt:Date.now(),
					updatedAt:Date.now()
				};

				docs.push(doc);
				saveDocuments(docs);
				loadDocumentIntoEditor(doc);

				document.getElementById('editor-drawer').classList.add('open');
				document.getElementById('sgml-input').focus();
			}

			function openLibrary(){
				renderLibraryList();

				document.getElementById('library-modal').classList.add('open');
				document.getElementById('library-modal').setAttribute('aria-hidden','false');
			}

			function closeLibrary(){
				document.getElementById('library-modal').classList.remove('open');
				document.getElementById('library-modal').setAttribute('aria-hidden','true');
			}

			function renderLibraryList(){
				const list=document.getElementById('library-list');

				const docs=loadDocuments().sort(
					(a,b)=>(b.updatedAt||0)-(a.updatedAt||0)
				);

				list.innerHTML='';

				if(!docs.length){
					list.innerHTML='<div class="sgml-library-empty">No saved SGML documents yet.</div>';
					return;
				}

				docs.forEach(doc=>{
					const row=document.createElement('div');
					row.className='sgml-library-item';

					const loadButton=document.createElement('button');
					loadButton.className='sgml-library-load';
					loadButton.type='button';

					const title=document.createElement('div');
					title.className='sgml-library-item-title';
					title.textContent=doc.title||'Untitled SGML';

					const preview=document.createElement('div');
					preview.className='sgml-library-item-preview';

					const firstLine=String(doc.content||'')
						.split(/\r?\n/,1)[0]||'(empty)';

					preview.textContent=firstLine;
					preview.title=firstLine;

					loadButton.appendChild(title);
					loadButton.appendChild(preview);

					loadButton.addEventListener('click',async()=>{
						const current=getCurrentDocument();
						const currentIsSame=current&&current.id===doc.id;

						if(!currentIsSame){
							const ok=await confirmDialog(
								`Load "${doc.title||'Untitled SGML'}"?\n\nThis will replace the SGML currently open in the editor.`,
								'Load SGML',
								'Load'
							);

							if(!ok)return;
						}

						closeLibrary();
						loadDocumentIntoEditor(doc);
					});

					const deleteButton=document.createElement('button');
					deleteButton.className='sgml-library-delete';
					deleteButton.type='button';
					deleteButton.textContent='X';
					deleteButton.setAttribute(
						'aria-label',
						`Delete ${doc.title||'Untitled SGML'}`
					);

					deleteButton.addEventListener('click',async event=>{
						event.stopPropagation();

						const ok=await confirmDialog(
							`Delete "${doc.title||'Untitled SGML'}"?\n\nThis saved SGML will be permanently removed from local storage.`,
							'Delete SGML',
							'Delete'
						);

						if(!ok)return;

						const docsNow=loadDocuments();

								const next=remaining.slice().sort(

									updatedAt:Date.now()
								};

								saveDocuments([next]);
								loadDocumentIntoEditor(next);
							}
						}

						renderLibraryList();
					});

## Edit the Code

SGML is text-based, so the study guide can be edited directly.

Change the text, formatting, questions, and answers in the SGML source.

### Example

Original:

<st col:#ff0000>This is red text.</st>

Edited:

<st col:#00aa00>This is now green text.</st>

The SGML viewer reads the edited source and renders the result as a study guide.

## SGML Formatting

### Plain Text

Plain text can be written normally.

This is ordinary SGML text.

### Colored Text

Use the \`<st>\` element to format text.

<st col:#ff0000>Red Text</st>

<st col:#12ABEF bg:#f0f8ff>Blue Text with Background</st>

### Nested Formatting

Formatting can be placed inside other formatting elements.

<st col:#ff0000>
Red outer
<st col:#00aa00>Green inner</st>
Back to red.
</st>

---

## Interactive Questions

### Multiple Choice

Use \`<Choices:...>\` to create a multiple-choice question.

<Choices:(What is <st col:#ff0000>2 + 2</st>?)[<st bg:#e0f2fe>4</st>, 3, 5, 6]{[idx:0]}>

The first part is the question.

The square brackets contain the available choices.

The final section contains the answer.

In this example:

<st col:#00aa00>[idx:0]</st>

means that the first choice is correct.

Another example:

<Choices:(Which city is the capital of France?)[Berlin, Madrid, Paris, Rome]{Paris}>

---

### Commas Inside Choices

A comma normally separates choices.

When a choice contains a comma, wrap that entire value in backticks.

Example:

<Choices:(Which city contains a comma in its name?)[Manila, \`Washington, D.C.\`, Cebu]{[idx:1]}>

The backticks tell the parser that the comma inside the wrapped value is part of the text and is not a choice separator.

This works for answers as well:

<Fillin:(Enter the full city name)[]{\`Washington, D.C.\`}>

The rendered answer is:

<st col:#0066ff>Washington, D.C.</st>

---

### Escaping

SGML supports backslash escaping for structural characters.

<st col:#0066ff>&#92;,</st>

means a literal comma.

<st col:#0066ff>&#92;|</st>

means a literal pipe.

<st col:#0066ff>&#92;&#96;</st>

means a literal backtick.

<st col:#0066ff>&#92;&#92;</st>

means a literal backslash.

Other structural characters can also be escaped when necessary.

Backslash escaping is processed before separators and backtick wrapping.

---

### Fill-in-the-Blank

Use \`<Fillin:...>\` when the learner must enter an answer.

<Fillin:(What is the capital of France?)[]{Paris}>

Multiple accepted answers can be separated by commas.

<Fillin:(What is 2 + 2?)[]{4,Four}>

Both \`4\` and \`Four\` are accepted.

A value containing a comma can be wrapped:

<Fillin:(What exact phrase is shown?)[]{\`Hello, world\`}>

Only one answer is defined here because the comma is inside the backtick-wrapped value.

---

### Enumeration

Use \`<Enumeration:...>\` for questions involving a collection of answers.

<Enumeration:(Name 3 Primary Colors)[]{Red,Green,Blue|count:3|case:false|inorder:false}>

The options after the answer separator can define additional rules.

\`count:3\`

Requires three answers.

\`case:false\`

Makes the answer comparison case-insensitive.

\`inorder:false\`

Does not require the answers to be entered in a particular order.

---

### Ordered Enumeration

Enumeration can also require a specific order.

<Enumeration:(Arrange these numbers in ascending order)[3, 1, 4, 2]{1,2,3,4|type:order}>

Here:

\`type:order\`

means that the sequence must be entered in the specified order.

# How SGML Works

SGML works by storing the study guide as plain text.

The viewer reads the SGML source and processes its markup.

---

## 1. SGML Source

The original document is text.

Example:

<Choices:(What is 2 + 2?)[4,3,5,6]{[idx:0]}>

---

## 2. Parser

The SGML parser searches the document for recognized structures.

For example:

\`<st ...>\`

is recognized as a formatting element.

\`<Choices:...>\`

is recognized as a multiple-choice question.

\`<Fillin:...>\`

is recognized as a fill-in-the-blank question.

\`<Enumeration:...>\`

is recognized as an enumeration question.

When parsing a choice list:

- commas outside backticks separate values
- commas inside backticks are literal
- escaped separators are literal
- escaped backticks do not start or end a wrapped value

---

## 3. Formatting

When the parser encounters formatting attributes such as:

<st col:#ff0000>Red</st>

it interprets:

\`col:#ff0000\`

as the text color.

For example:

<st col:#ff0000>Red</st>

renders as red text.

A background can also be supplied:

<st col:#12ABEF bg:#f0f8ff>Blue Text</st>

---

## 4. Question Parsing

An interactive question contains different parts.

Example:

<Choices:(What is 2 + 2?)[4,3,5,6]{[idx:0]}>

The parser can interpret it as:

Question:

\`What is 2 + 2?\`

Choices:

\`4, 3, 5, 6\`

Correct answer:

\`[idx:0]\`

Therefore the viewer knows which answer should be accepted.

A wrapped choice is parsed as one value:

<Choices:(Example)[Apple, \`Washington, D.C.\`, Banana]{[idx:1]}>

The comma inside \`Washington, D.C.\` does not create another choice.

---

## 5. Validation

After the learner submits an answer, the viewer compares it with the answer stored in the SGML.

For example:

<Fillin:(What is 2 + 2?)[]{4,Four}>

The viewer can accept:

\`4\`

or:

\`Four\`

depending on the answer rules implemented by the viewer.

---

## 6. Markdown Structure

SGML also uses Markdown-style structure.

A heading such as:

## Formatting

creates a section.

A larger heading such as:

# Study Guide: SGML

creates the main title.

This makes SGML easy to write and edit as ordinary text.

---

## 7. Offline Mode

Offline Mode separates the study guide's content from its network dependency.

The SGML document itself is still ordinary text, while the viewer can use cached resources and local browser storage to continue working offline.

This means the general workflow can be:

<st col:#00aa00>Load → Cache → Disconnect → Study Offline</st>

---

## SGML Structure Summary

An SGML study guide can therefore contain:

<st col:#0066ff>Markdown</st>
for document structure.

<st col:#0066ff>&lt;st&gt;</st>
for formatting.

<st col:#0066ff>&lt;Choices&gt;</st>
for multiple-choice questions.

<st col:#0066ff>&lt;Fillin&gt;</st>
for text answers.

<st col:#0066ff>&lt;Enumeration&gt;</st>
for lists and ordered answers.

Together, these components allow one \`.sgml\` file to contain both the learning material and the interactive quiz logic.

			function initializeLibrary(){
				let docs=loadDocuments();
				const savedId=localStorage.getItem(STORAGE_CURRENT_ID);
				const savedContent=localStorage.getItem(STORAGE_CURRENT_CONTENT);

				let current=docs.find(doc=>doc.id===savedId);

				if(!current&&docs.length){
					current=docs.slice().sort(
						(a,b)=>(b.updatedAt||0)-(a.updatedAt||0)
					)[0];
				}

				if(!current){
					current={
						id:makeId(),
						title:'Sample SGML',
						content:savedContent!==null?savedContent:defaultSGML,
						createdAt:Date.now(),
						updatedAt:Date.now()
					};

					docs.push(current);
					saveDocuments(docs);
				}else if(savedContent!==null&&current.id===savedId){
					current.content=savedContent;
					current.updatedAt=Date.now();

					saveDocuments(
						docs.map(doc=>
							doc.id===current.id?current:doc
						)
					);
				}

				currentDocumentId=current.id;

				localStorage.setItem(
					STORAGE_CURRENT_ID,
					current.id
				);

				localStorage.setItem(

					current.content||''
				);

				renderSGML(current.content||'');
